const DevMode = {
  // D：目前編輯到哪裡。view=哪個畫面，uid=哪個單元，key=哪個步驟，idx=第幾題，item=正在編輯的題目（副本）
  D:{view:'units',uid:null,key:null,idx:null,item:null,fv:'all'},

  // ───────────── 進入 / 離開 ─────────────
  open(){ $('#unitLayer').classList.remove('open'); this.D.view='units'; $('#devLayer').classList.add('open'); $('#nav').style.display='none'; this.render(); },
  exit(){ $('#devLayer').classList.remove('open'); $('#nav').style.display='flex'; App.render(); },
  // init：程式啟動時呼叫一次：綁定按鈕事件。DEV_ENABLED 為 false 時把 🛠 藏起來
  init(){
    const y=$('#devLayer');
    y.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b) this.act(b.dataset.a,b); });
    y.addEventListener('input',e=>{ const el=e.target; if(el.id==='dvUnlock'){ DEV.unlockAll=el.checked; return; } if(el.dataset&&el.dataset.r) this.bind(el); });
    y.addEventListener('change',e=>{ if(e.target.id==='dvFile') this.doImport(e.target); if(e.target.id==='dvFv'){ this.D.fv=e.target.value; this.render(); } });
    if(!DEV_ENABLED){ $('#devFab').style.display='none'; y.remove(); }
    else if(location.hash==='#dev') this.open();
  },

  // ───────────── 資料讀寫小幫手 ─────────────
  // tgt：根據 data-r（例如 'vocab:3'）找到要修改的那筆資料
  tgt(r){ const [k,i]=r.split(':'); if(k==='item') return this.D.item; if(k==='vocab') return VOCAB[+i]; if(k==='speech') return SPEECH[+i]; if(k==='unit') return UNITS[+i]; if(k==='stage') return STAGES[this.D.uid][+i]; },
  bank(){ return STAGEBANK['u'+this.D.uid+'-'+this.D.key]; },
  meta(){ return STAGES[this.D.uid].find(s=>s.key===this.D.key); },
  // persist：資料改變後：整理衍生資料 + 自動儲存
  persist(){
    UNITS.forEach(u=>{ if(!u.en) u.en=u.zh; });
    rebuildDerived(); saveContent();
    const s=$('#dvSaved'); if(s) s.textContent='✓ 已自動儲存 '+new Date().toLocaleTimeString();
  },
  // bind：在輸入框打字／選擇時，把值存進資料
  bind(el){
    const ds=el.dataset, obj=this.tgt(ds.r); if(!obj) return;
    let v; if(el.type==='checkbox') v=el.checked; else if(el.type==='radio') v=+el.value; else v=el.value;
    if(ds.k==='br') v=v.replace(/\n/g,'<br>');
    if(ds.k==='words') v=v.split(/\s+/).filter(Boolean);
    if(ds.k==='num') v=+v;
    if(ds.k==='audio') v=v.trim()?ASSETS.audio+v.trim():'';
    setBy(obj,ds.p,v);
    if(ds.r!=='item'){ this.persist(); if(ds.re) this.render(true); }
  },
  // usedBy：這個生詞／口說句子有多少題目正在使用（正在使用的不能刪）
  usedBy(kind,id){ let n=0; Object.values(STAGEBANK).forEach(b=>b.items.forEach(it=>{ if(kind==='vocab'&&it.t==='flip'&&it.v===id) n++; if(kind==='speech'&&it.t==='speak'&&it.sid===id) n++; })); return n; },
  confirm(title,body,onOk){ Modal.confirm({title,body,ok:'確定',cancel:'取消',onOk}); },

  // ───────────── 表單欄位產生器（回傳 HTML 文字）─────────────
  // fld：一個文字輸入框。r=資料位置，p=欄位路徑，o 可放 {area:true 多行, br:true 換行轉<br>, words:true, num:true, audio:true, help:'說明', ph:'提示字'}
  fld(r,label,p,o={}){
    const obj=this.tgt(r)||{}; let v=getBy(obj,p);
    if(o.br) v=String(v||'').replace(/<br>/g,'\n'); if(o.words) v=(v||[]).join(' ');
    if(o.audio) v=String(v||'').replace(ASSETS.audio,'');
    const k=o.br?'br':o.words?'words':o.num?'num':o.audio?'audio':'';
    const at=`data-r="${r}" data-p="${p}" ${k?`data-k="${k}"`:''}`;
    const ctl=o.area?`<textarea class="inp dv" rows="${o.rows||3}" ${at} placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`:`<input class="inp dv" ${at} value="${esc(v)}" placeholder="${esc(o.ph||'')}">`;
    return `<label class="dv-f"><span>${label}</span>${ctl}${o.help?`<small>${o.help}</small>`:''}</label>`;
  },
  // lf：中文 + 英文 兩個輸入框（英文可留空，會自動沿用中文）
  lf(r,label,p,o={}){
    const obj=this.tgt(r)||{}; const z=getBy(obj,p+'.zh')||'', e=getBy(obj,p+'.en')||'';
    const one=(k,v,ph)=>o.area?`<textarea class="inp dv" rows="${o.rows||3}" data-r="${r}" data-p="${p}.${k}" placeholder="${ph}">${esc(v)}</textarea>`:`<input class="inp dv" data-r="${r}" data-p="${p}.${k}" value="${esc(v)}" placeholder="${ph}">`;
    return `<div class="dv-f"><span>${label}</span><div class="grid grid-cols-2 gap-2">${one('zh',z,'中文')}${one('en',e,'English（可留空）')}</div>${o.help?`<small>${o.help}</small>`:''}</div>`;
  },
  // sel：下拉選單。opts=[[值,顯示文字],…]
  sel(r,label,p,opts,o={}){
    const obj=this.tgt(r)||{}; const cur=String(getBy(obj,p)==null?'':getBy(obj,p));
    return `<label class="dv-f"><span>${label}</span><select data-r="${r}" data-p="${p}" ${o.num?'data-k="num"':''} ${o.re?'data-re="1"':''}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===cur?'selected':''}>${esc(t)}</option>`).join('')}</select>${o.help?`<small>${o.help}</small>`:''}</label>`;
  },
  // vocSel：選擇「對應生詞」（選填）
  vocSel(){ const it=this.D.item; return this.sel('item','對應生詞（選填：答題結果會影響這個字的「熟悉度」）','v',[['','（不指定）']].concat(VOCAB.filter(v=>v.u===this.D.uid).map(v=>[v.id,`${v.han}　${v.en}`]))); },
  // optsBlock：選項清單（單選：圓點選正確答案；多選：打勾）
  optsBlock(multi){
    const it=this.D.item;
    return `<div class="dv-f"><span>選項　${multi?'（打勾＝正確答案，可多選）':'（點左邊圓點＝正確答案）'}</span>${(it.opts||[]).map((o,i)=>`<div class="dv-row">
      ${multi?`<input type="checkbox" data-r="item" data-p="_c.${i}" ${it._c&&it._c[i]?'checked':''}>`:`<input type="radio" name="dvans" value="${i}" data-r="item" data-p="_a" ${it._a===i?'checked':''}>`}
      <input class="inp dv" data-r="item" data-p="opts.${i}" value="${esc(o)}" placeholder="選項 ${i+1}">
      <button class="dv-ic" data-a="rm" data-p="opts" data-i="${i}">✕</button></div>`).join('')}
      <button class="btn btn-ghost btn-sm" data-a="add" data-p="opts" data-def='""'>＋ 新增選項</button></div>`;
  },
  // rows：多列輸入（配對、排序用）。cols=[[子路徑,提示字],…]
  rows(label,p,cols,def,o={}){
    const arr=getBy(this.D.item,p)||[];
    return `<div class="dv-f"><span>${label}</span>${arr.map((row,i)=>`<div class="dv-row">${o.num?`<b style="width:22px">${i+1}</b>`:''}${cols.map(([sp,ph])=>`<input class="inp dv" data-r="item" data-p="${p}.${i}${sp}" value="${esc(getBy(row,sp.slice(1)))}" placeholder="${ph}">`).join('')}
      ${o.move?`<button class="dv-ic" data-a="mv" data-p="${p}" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>↑</button><button class="dv-ic" data-a="mv" data-p="${p}" data-i="${i}" data-d="1" ${i===arr.length-1?'disabled':''}>↓</button>`:''}
      <button class="dv-ic" data-a="rm" data-p="${p}" data-i="${i}">✕</button></div>`).join('')}
      <button class="btn btn-ghost btn-sm" data-a="add" data-p="${p}" data-def='${JSON.stringify(def)}'>＋ 新增一列</button></div>`;
  },

  // ───────────── 畫面 ─────────────
  // render：重畫整個開發者畫面。keep=true 時保留捲動位置（新增／刪除一列時使用）
  render(keep){
    const D=this.D, v=D.view, y=$('#devLayer'); if(!y) return;
    const sc=y.querySelector('.dv-scroll'), st=sc?sc.scrollTop:0;
    const top=`<div class="dv-top"><b style="font-size:17px">🛠 開發者模式</b><span id="dvSaved" style="font-size:12px;opacity:.8">自動儲存中</span><span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="SoundTest.run()">🔊 測試聲音</button>
      <label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="dvUnlock" ${DEV.unlockAll?'checked':''}>測試時解鎖全部單元</label>
      <button class="btn btn-ghost" data-a="export">💾 匯出內容</button><button class="btn btn-ghost" data-a="import">📂 匯入內容</button>
      <button class="btn btn-ghost" data-a="html">⬇ 下載更新後的 index.html</button><button class="btn btn-ghost" data-a="reset">↺ 還原</button>
      <button class="btn btn-primary" data-a="exit">▶ 結束並測試</button><input type="file" id="dvFile" accept=".json,application/json" style="display:none"></div><pre id="stOut" style="margin:0;background:#1d2026;color:#cfe;font-size:12px;white-space:pre-wrap;padding:6px 14px;min-height:0"></pre>`;
    const main=['units','unit','stage','item'].includes(v);
    const tab=(k,label,on)=>`<button class="dv-tab ${on?'on':''}" data-a="nav" data-v="${k}">${label}</button>`;
    const body= v==='units'?this.vUnits(): v==='unit'?this.vUnit(): v==='stage'?this.vStage(): v==='item'?this.vItem(): v==='vocab'?this.vVocab(): this.vSpeech();
    y.innerHTML=top+`<div class="dv-scroll" style="flex:1;overflow-y:auto"><div class="dv-wrap"><div class="dv-tabs">${tab('units','📚 單元與題目',main)}${tab('vocab','📖 生詞庫',v==='vocab')}${tab('speech','🎤 口說句子',v==='speech')}</div>${body}</div></div>`;
    const ns=y.querySelector('.dv-scroll'); ns.scrollTop=keep?st:0;
  },
  back(v,label){ return `<button class="btn btn-ghost btn-sm mb-3" data-a="nav" data-v="${v}">← ${label}</button>`; },

  // vUnits：單元清單（開發者首頁）
  vUnits(){
    const rows=UNITS.map((u,i)=>{
      const n=Object.keys(STAGEBANK).filter(k=>k.startsWith('u'+u.id+'-')).reduce((a,k)=>a+STAGEBANK[k].items.length,0), m=VOCAB.filter(v=>v.u===u.id).length;
      return `<div class="dv-card"><div class="flex items-center gap-3">
        <div style="font-size:34px">${esc(u.emoji)}</div>
        <div class="flex-1"><div class="font-black">單元 ${u.id}・${esc(u.zh)} <span class="badge b-prog">${u.level}</span></div>
        <div class="text-xs text-slate-500">${u.plan?`5 步驟流程・共 ${n} 題・生詞 ${m} 個`:'<b style="color:#c98a00">⚠ 舊版課程（尚未改成 5 步驟流程）</b>'}</div></div>
        <button class="dv-ic" data-a="mvUnit" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>↑</button><button class="dv-ic" data-a="mvUnit" data-i="${i}" data-d="1" ${i===UNITS.length-1?'disabled':''}>↓</button>
        <button class="btn btn-blue btn-sm" data-a="unit" data-id="${u.id}">✎ 編輯</button>
        <button class="dv-ic" data-a="delUnit" data-id="${u.id}">🗑</button></div></div>`; }).join('');
    return `<div class="dv-warn">💡 排在越上面的單元越先學；學生要完成前一個單元才能解鎖下一個。可用 ↑ ↓ 調整順序。你改的每個字都會自動儲存。</div>${rows}<button class="btn btn-primary" data-a="newUnit">＋ 新增單元</button>`;
  },

  // vUnit：編輯一個單元（基本資料 + 5 個步驟）
  vUnit(){
    const D=this.D, i=UNITS.findIndex(u=>u.id===D.uid), u=UNITS[i]; if(!u){ D.view='units'; return this.vUnits(); }
    const r='unit:'+i;
    let h=this.back('units','單元清單')+`<div class="dv-card"><div class="font-black mb-3">單元 ${u.id}：基本資料</div>
      <div class="grid grid-cols-2 gap-3">${this.fld(r,'單元名稱（中文）','zh')}${this.fld(r,'Unit name（English）','en')}</div>
      <div class="grid grid-cols-2 gap-3">${this.sel(r,'級別','level',[['A1','A1'],['A2','A2']],{re:true})}${this.fld(r,'封面圖示（一個 emoji）','emoji')}</div>
      ${this.lf(r,'主題說明','topic')}
      ${this.sel(r,'封面顏色','grad',GRADS.map(g=>[g[1],g[0]]))}
      <small style="color:#999">想用自己的封面圖：把圖片命名成 unit${u.id}.png 放進 assets/images 資料夾。</small></div>`;
    if(!u.plan) return h+`<div class="dv-warn">這個單元還是舊版「一堂一堂課」的格式，無法在這裡編輯題目。按下面的按鈕可以改成 5 步驟流程（單字字卡會自動依本單元生詞建立，其他步驟需要你自己新增題目）。</div><button class="btn btn-primary" data-a="convert" data-id="${u.id}">改成 5 步驟流程</button>`;
    h+=`<div class="font-black mb-2">學習步驟（點「編輯題目」進去新增題目）</div>`+STAGES[u.id].map(s=>{
      const n=STAGEBANK['u'+u.id+'-'+s.key].items.length;
      return `<div class="dv-card flex items-center gap-3"><div style="font-size:28px">${s.icon}</div>
        <div class="flex-1"><div class="font-black">${tx(s.title)} <span class="badge ${n?'b-done':'b-lock'}">${n} 題</span></div><div class="text-xs text-slate-500">${tx(s.desc)}</div></div>
        <button class="btn btn-blue btn-sm" data-a="stage" data-k="${s.key}">✎ 編輯題目</button></div>`; }).join('');
    h+=`<div class="flex gap-2 flex-wrap mt-3"><button class="btn btn-ghost" data-a="gotoVocab" data-id="${u.id}">📖 本單元的生詞（${VOCAB.filter(v=>v.u===u.id).length}）</button>
      <button class="btn btn-primary" data-a="testUnit" data-id="${u.id}">▶ 測試這個單元（自動解鎖）</button></div>`;
    return h;
  },

  // vStage：一個步驟裡的所有題目（可排序、複製、刪除、預覽）
  vStage(){
    const D=this.D, b=this.bank(), m=this.meta(); if(!b||!m){ D.view='unit'; return this.vUnit(); }
    const si=STAGES[D.uid].indexOf(m), r='stage:'+si, types=STAGE_TYPES[D.key]||[];
    const list=b.items.map((it,i)=>`<div class="dv-card" style="padding:10px"><div class="flex items-center gap-2">
        <b style="width:26px;color:#999">${i+1}</b><span class="badge b-prog">${TYPE_NAMES[it.t]||it.t}</span>

        <button class="dv-ic" data-a="mvItem" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>↑</button><button class="dv-ic" data-a="mvItem" data-i="${i}" data-d="1" ${i===b.items.length-1?'disabled':''}>↓</button>
        <button class="dv-ic" data-a="editItem" data-i="${i}">✎</button><button class="dv-ic" data-a="dupItem" data-i="${i}">⧉</button><button class="dv-ic" data-a="delItem" data-i="${i}">🗑</button></div></div>`).join('');

      ${this.lf(r,'步驟名稱','title')}${this.lf(r,'一句話說明','desc')}</div>
      <div class="font-black mb-2">題目（學生會照這個順序做）　共 ${b.items.length} 題</div>${list||'<div class="dv-warn">這個步驟還沒有題目。學生會看到「尚無題目」，也無法繼續往下。</div>'}
      <div class="dv-card flex flex-wrap items-center gap-2"><select id="dvNewType" style="width:auto">${types.map(t=>`<option value="${t}">${TYPE_NAMES[t]}</option>`).join('')}</select>
        <button class="btn btn-primary btn-sm" data-a="newItem">＋ 新增題目</button>
        ${D.key==='vl'?`<button class="btn btn-blue btn-sm" data-a="addAllFlip">＋ 加入本單元所有生詞字卡</button>`:''}
        <button class="btn btn-ghost btn-sm" data-a="prevStage" ${b.items.length?'':'disabled'}>👁 預覽這個步驟</button></div>`;
  },
  // sum：題目在清單裡顯示的一行摘要
  sum(it){
    switch(it.t){
      case 'flip': { const v=vById(it.v); return v?`${v.han}　${v.py}　${v.en}`:'⚠ 找不到這個生詞'; }
      case 'speak': { const s=SPEECH.find(x=>x.id===it.sid); return s?s.han:'⚠ 找不到這個句子'; }
      case 'match': return `${tx(it.q)||'配對'}（${(it.pairs||[]).length} 組）`;
      case 'order': return String(tx(it.en)); case 'grammar': return String(tx(it.title)); case 'listen': return '🔊 '+it.say;
      default: return String(tx(it.q)||'').replace('___','＿＿');
    }
  },

  // vItem：單一題目的編輯表單
  vItem(){
    const it=this.D.item; if(!it){ this.D.view='stage'; return this.vStage(); }
    return this.back('stage','回到題目清單')+`<div class="dv-card"><div class="font-black mb-3">${this.D.idx===null?'新增':'編輯'}：<span class="badge b-prog">${TYPE_NAMES[it.t]}</span></div>${this.form(it)}</div>
      <div class="flex gap-2 flex-wrap"><button class="btn btn-primary" data-a="saveItem">✔ 儲存這一題</button><button class="btn btn-blue" data-a="prevItem">👁 預覽這一題</button><button class="btn btn-ghost" data-a="nav" data-v="stage">取消</button></div>`;
  },
  // form：依題型回傳不同的表單
  form(it){
    const r='item';
    switch(it.t){
      case 'flip': { const vs=VOCAB.filter(v=>v.u===this.D.uid); return vs.length?this.sel(r,'選擇生詞','v',vs.map(v=>[v.id,`${v.han}　${v.py}　${v.en}`])):'<div class="dv-warn">本單元還沒有生詞。請先到「📖 生詞庫」新增，再回來加字卡。</div>'; }
      case 'mc': return this.lf(r,'題目','q')+this.optsBlock(false)+this.lf(r,'答題後的解釋（選填）','exp')+this.vocSel();
      case 'read': return this.fld(r,'短文或對話（按 Enter 換行）','passage',{area:true,br:true,rows:4})+this.fld(r,'拼音（選填，學生可展開查看）','pinyin',{area:true,br:true,rows:4})+this.lf(r,'問題','q')+this.optsBlock(false)+this.lf(r,'答題後的解釋（選填）','exp');
      case 'listen': return this.fld(r,'要朗讀的詞或句子','say',{help:'沒有音檔時，電腦會朗讀這個。學生聽到後，要從選項選出來。'})+this.fld(r,'音檔檔名（選填）','audio',{audio:true,help:'把 mp3 放進 assets/audio 資料夾，這裡填檔名，例如 u1_listen1.mp3。檔案不存在時會自動用電腦朗讀。'})+this.lf(r,'題目','q')+this.optsBlock(false)+this.lf(r,'答題後的解釋（選填）','exp')+this.vocSel();
      case 'fill': return this.fld(r,'題目（用三個底線 ___ 表示空格）','q',{ph:'例：見面時，我說「___」。'})+this.optsBlock(false)+this.lf(r,'答題後的解釋（選填）','exp')+this.vocSel();
      case 'type': return this.fld(r,'題目（用三個底線 ___ 表示空格）','q',{ph:'例：我是 ___。'})+this.fld(r,'提示（選填）','hint',{ph:'例：student・xuéshēng'})+`<div class="grid grid-cols-2 gap-3">${this.fld(r,'正確答案（漢字）','_h')}${this.fld(r,'拼音（含聲調，選填）','_p',{help:'有填的話，學生打 xuesheng 也算對'})}</div>`+this.lf(r,'答題後的解釋（選填）','exp')+this.vocSel();
      case 'match': return this.lf(r,'題目標題','q')+this.rows('配對組合（左邊 ＝ 右邊，至少 2 組）','pairs',[['.0','左邊'],['.1','右邊']],['','']);
      case 'order': return this.lf(r,'題目：要排出的句子的英文意思','en')+this.rows('正確的詞（請「依正確順序」由上到下填；右邊拼音選填）','_tk',[['.w','詞'],['.p','拼音']],{w:'',p:''},{num:true,move:true})+this.rows('干擾用的多餘詞（選填）','_ex',[['.w','詞'],['.p','拼音']],{w:'',p:''})+this.lf(r,'答題後的解釋（選填）','exp');
      case 'multi': return this.lf(r,'題目','q')+this.optsBlock(true)+this.lf(r,'答題後的解釋（選填）','exp');
      case 'speak': return SPEECH.length?this.sel(r,'選擇要念的句子','sid',SPEECH.map(s=>[s.id,s.han]),{help:'想新增句子：到「🎤 口說句子」分頁。'}):'<div class="dv-warn">還沒有口說句子，請先到「🎤 口說句子」分頁新增。</div>';
      case 'grammar': return this.lf(r,'文法標題','title')+this.lf(r,'說明文字','body',{area:true})+this.fld(r,'句型公式（選填）','formula',{ph:'例：主詞 + 是 + 名詞'})+this.lf(r,'小提醒（選填）','tip')+this.rows('例句（中文 / 拼音 / 英文）','ex',[['.0','中文例句'],['.1','拼音'],['.2','英文']],['','','']);
    }
    return '';
  },

  // vVocab：生詞庫。這裡的每個生詞，都能被字卡和題目使用
  vVocab(){
    const D=this.D, list=VOCAB.map((v,i)=>[v,i]).filter(([v])=>D.fv==='all'||String(v.u)===String(D.fv));
    const filt=`<select data-a="fv" id="dvFv" style="width:auto;margin-right:8px"><option value="all">全部單元</option>${UNITS.map(u=>`<option value="${u.id}" ${String(D.fv)===String(u.id)?'selected':''}>單元 ${u.id} ${esc(u.zh)}</option>`).join('')}</select>`;
    const cards=list.map(([v,i])=>{ const r='vocab:'+i; return `<div class="dv-card">
      <div class="grid grid-cols-2 gap-3">${this.fld(r,'漢字','han')}${this.fld(r,'拼音（含聲調）','py')}</div>
      <div class="grid grid-cols-2 gap-3">${this.fld(r,'英文意思','en')}${this.fld(r,'詞性','pos',{ph:'n. v. adj. adv. pron. phr.'})}</div>
      ${this.fld(r,'例句','ex')}<div class="grid grid-cols-2 gap-3">${this.fld(r,'例句拼音','exPy')}${this.fld(r,'例句英文','exEn')}</div>
      <div class="grid grid-cols-2 gap-3">${this.sel(r,'所屬單元','u',UNITS.map(u=>[u.id,`單元 ${u.id} ${u.zh}`]),{num:true,re:true})}
      <div class="dv-f"><span>發音檔名（自動）</span><div class="text-sm" style="padding:8px 0;color:#666">${esc(v.audio.replace(ASSETS.audio,''))}</div></div></div>
      <button class="dv-ic" data-a="delVocab" data-i="${i}">🗑 刪除這個生詞</button></div>`; }).join('');
    return `<div class="dv-warn">💡 生詞庫是全站共用的：字卡、題目、「詞彙」分頁都讀這裡。音檔檔名會依「單元＋順序」自動產生（想錄音時照這個檔名存）。</div>
      <div class="flex items-center mb-3">${filt}<button class="btn btn-primary btn-sm" data-a="newVocab">＋ 新增生詞</button></div>${cards||'<div class="dv-warn">這個單元還沒有生詞。</div>'}`;
  },
  // vSpeech：口說句子
  vSpeech(){
    const cards=SPEECH.map((s,i)=>{ const r='speech:'+i; return `<div class="dv-card">
      ${this.fld(r,'句子（學生要念的）','han')}<div class="grid grid-cols-2 gap-3">${this.fld(r,'拼音','py')}${this.fld(r,'英文意思','en')}</div>
      ${this.fld(r,'詞語切分（用空白分開每個詞）','words',{words:true,help:'例：你好 我 是 學生　（辨識出錯時，會逐詞標示）'})}
      <div class="text-xs text-slate-500 mb-2">示範音檔：${esc(String(s.audio||'').replace(ASSETS.audio,''))}（放進 assets/audio；沒有檔案就用電腦朗讀）</div>
      <button class="dv-ic" data-a="delSpeech" data-i="${i}">🗑 刪除這個句子</button></div>`; }).join('');
    return `<div class="dv-warn">💡 口說句子會出現在「口說」分頁，也能在題目裡新增「發音」題來使用。</div><button class="btn btn-primary btn-sm mb-3" data-a="newSpeech">＋ 新增句子</button>${cards}`;
  },

  // ───────────── 題目 ↔ 表單 ─────────────
  // blank：產生一題「空白的新題目」（表單用的格式）
  blank(type){
    const uid=this.D.uid, Lz=()=>({zh:'',en:''}), items=this.bank().items;
    switch(type){
      case 'flip': { const u=VOCAB.find(v=>v.u===uid); return {t:'flip',v:u?u.id:''}; }
      case 'mc': return {t:'mc',q:Lz(),opts:['',''],_a:null,exp:Lz(),v:''};
      case 'fill': return {t:'fill',q:'',opts:['',''],_a:null,exp:Lz(),v:''};
      case 'match': return {t:'match',q:{zh:'把漢字與英文配對',en:'Match characters with English'},pairs:[['',''],['','']]};
      case 'listen': { const n=items.filter(x=>x.t==='listen').length+1; return {t:'listen',q:{zh:'你聽到的是哪一個詞？',en:'Which word did you hear?'},say:'',audio:`${ASSETS.audio}u${uid}_listen${n}.mp3`,opts:['',''],_a:null,exp:Lz(),v:''}; }
      case 'type': return {t:'type',q:'',hint:'',_h:'',_p:'',exp:Lz(),v:''};
      case 'order': return {t:'order',en:Lz(),_tk:[{w:'',p:''},{w:'',p:''}],_ex:[],exp:Lz()};
      case 'multi': return {t:'multi',q:Lz(),opts:['',''],_c:[false,false],exp:Lz()};
      case 'speak': return {t:'speak',sid:SPEECH[0]?SPEECH[0].id:''};
      case 'grammar': return {t:'grammar',gid:'g'+Date.now().toString(36),title:Lz(),body:Lz(),formula:'',tip:Lz(),ex:[['','',''],['','','']]};
      case 'read': { const p=[...items].reverse().find(x=>x.t==='read'); return {t:'read',passage:p?p.passage:'',pinyin:p?p.pinyin:'',q:Lz(),opts:['','',''],_a:null,exp:Lz()}; }
    }
  },
  // toForm：把「已存在的題目」轉成表單用的格式（加上以 _ 開頭的暫存欄位）
  toForm(src){
    const it=JSON.parse(JSON.stringify(src)), Lz=o=>(o&&typeof o==='object')?{zh:o.zh||'',en:o.en||''}:{zh:o||'',en:''};
    if(['mc','listen','read','match','multi'].includes(it.t)) it.q=Lz(it.q);
    if(['mc','listen','read','multi','fill','type','order'].includes(it.t)) it.exp=Lz(it.exp);
    if(it.t==='order') it.en=Lz(it.en);
    if(it.t==='grammar'){ it.title=Lz(it.title); it.body=Lz(it.body); it.tip=Lz(it.tip); it.formula=it.formula||''; }
    if(['mc','listen','read'].includes(it.t)) it._a=it.ans;
    if(it.t==='fill') it._a=(it.opts||[]).indexOf(it.ans);
    if(it.t==='multi') it._c=(it.opts||[]).map((_,i)=>(it.ans||[]).includes(i));
    if(it.t==='type'){ it._h=(it.ans||[])[0]||''; it._p=(it.ans||[])[2]||''; }
    if(it.t==='order'){ const py=it.py||{}; it._tk=(it.tokens||[]).map(w=>({w,p:py[w]||''})); it._ex=(it.extra||[]).map(w=>({w,p:py[w]||''})); }
    if(['mc','fill','listen','type'].includes(it.t)&&it.v===undefined) it.v='';
    return it;
  },
  // fromForm：檢查表單內容；沒問題就轉回「正式題目」格式，有問題回傳 {err:'提示'}
  fromForm(w){
    const it=JSON.parse(JSON.stringify(w)), T=x=>String(x==null?'':x).trim();
    const L2=o=>{ o=o||{}; const zh=T(o.zh); return {zh,en:T(o.en)||zh}; };
    const fin=r=>{ const e=L2(it.exp); if(e.zh) r.exp=e; if(T(it.v)) r.v=T(it.v); return {it:r}; };
    const opts=()=>(it.opts||[]).map(T);
    const chk=o=>o.length<2?'至少要有 2 個選項':o.some(x=>!x)?'選項不能留空（不要的選項請按 ✕ 刪除）':null;
    switch(it.t){
      case 'flip': return it.v?{it:{t:'flip',v:it.v}}:{err:'請選擇一個生詞（若沒有，請先到「生詞庫」新增）'};
      case 'mc': case 'listen': case 'read': {
        const q=L2(it.q), o=opts(); if(!q.zh) return {err:'請輸入題目'};
        const e=chk(o); if(e) return {err:e};
        if(typeof it._a!=='number') return {err:'請點選項左邊的圓點，指定「正確答案」'};
        const r={t:it.t,q,opts:o,ans:it._a};
        if(it.t==='listen'){ if(!T(it.say)) return {err:'請輸入要朗讀的詞'}; r.say=T(it.say); r.audio=T(it.audio); }
        if(it.t==='read'){ if(!T(it.passage)) return {err:'請輸入短文或對話'}; r.passage=T(it.passage); r.pinyin=T(it.pinyin); }
        return fin(r); }
      case 'fill': {
        const q=T(it.q), o=opts(); if(!q.includes('___')) return {err:'題目裡要有三個底線 ___ 表示空格'};
        const e=chk(o); if(e) return {err:e};
        if(typeof it._a!=='number'||!o[it._a]) return {err:'請點選項左邊的圓點，指定「正確答案」'};
        return fin({t:'fill',q,opts:o,ans:o[it._a]}); }
      case 'type': {
        const q=T(it.q), h=T(it._h), p=T(it._p); if(!q.includes('___')) return {err:'題目裡要有三個底線 ___ 表示空格'};
        if(!h) return {err:'請輸入正確答案（漢字）'};
        const r={t:'type',q,ans:p?[h,plain(p),p]:[h]}; if(T(it.hint)) r.hint=T(it.hint);
        return fin(r); }
      case 'match': {
        const rows=(it.pairs||[]).map(p=>[T(p[0]),T(p[1])]).filter(p=>p[0]||p[1]);
        if(rows.length<2) return {err:'配對題至少要 2 組'}; if(rows.some(p=>!p[0]||!p[1])) return {err:'每一組的左右兩邊都要填'};
        const q=L2(it.q); return {it:{t:'match',q:q.zh?q:{zh:'配對',en:'Match'},pairs:rows}}; }
      case 'order': {
        const en=L2(it.en); if(!en.zh) return {err:'請輸入題目（句子的英文意思）'};
        const tk=(it._tk||[]).filter(x=>T(x.w)), ex=(it._ex||[]).filter(x=>T(x.w));
        if(tk.length<2) return {err:'「正確的詞」至少要 2 個'};
        const py={}; tk.concat(ex).forEach(x=>{ if(T(x.p)) py[T(x.w)]=T(x.p); });
        const r={t:'order',en,tokens:tk.map(x=>T(x.w)),ans:tk.map(x=>T(x.w)).join('')}; if(ex.length) r.extra=ex.map(x=>T(x.w)); if(Object.keys(py).length) r.py=py;
        return fin(r); }
      case 'multi': {
        const q=L2(it.q), o=opts(); if(!q.zh) return {err:'請輸入題目'}; const e=chk(o); if(e) return {err:e};
        const ans=(it._c||[]).map((c,i)=>c?i:-1).filter(i=>i>=0); if(!ans.length) return {err:'請至少勾選一個正確答案'};
        return fin({t:'multi',q,opts:o,ans}); }
      case 'speak': return SPEECH.find(s=>s.id===it.sid)?{it:{t:'speak',sid:it.sid}}:{err:'請選擇口說句子'};
      case 'grammar': {
        const title=L2(it.title), body=L2(it.body); if(!title.zh||!body.zh) return {err:'請輸入文法標題與說明'};
        const ex=(it.ex||[]).map(e=>[T(e[0]),T(e[1]),T(e[2])]).filter(e=>e[0]||e[1]||e[2]);
        if(!ex.length) return {err:'至少要有 1 個例句'}; if(ex.some(e=>!e[0])) return {err:'每個例句都要有中文'};
        const r={t:'grammar',gid:it.gid,title,body,ex}; if(T(it.formula)) r.formula=T(it.formula); const tip=L2(it.tip); if(tip.zh) r.tip=tip;
        return {it:r}; }
    }
    return {err:'未知的題型'};
  },

  // ───────────── 預覽：用學生的畫面試做，但【不會】改動學生進度 ─────────────
  preview(items){
    const snap=JSON.stringify(S);
    Lesson.open({id:'preview',title:L('預覽','Preview'),real:false,entries:items.map((item,i)=>({item:JSON.parse(JSON.stringify(item)),key:'pv:'+i})),onClose:()=>{ S=JSON.parse(snap); save(); }});
  },

  // ───────────── 按鈕動作（所有 data-a="..." 的按鈕都會來這裡）─────────────
  act(a,el){
    const D=this.D, ds=el.dataset, mvArr=(arr,i,d)=>{ const j=i+d; if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; };
    switch(a){
      case 'exit': return this.exit();
      case 'nav': D.view=ds.v; if(ds.v!=='stage') D.item=null; return this.render();
      case 'fv': return;
      case 'unit': D.uid=+ds.id; D.view='unit'; return this.render();
      case 'stage': D.key=ds.k; D.view='stage'; return this.render();
      case 'gotoVocab': D.fv=ds.id; D.view='vocab'; return this.render();
      case 'testUnit': DEV.unlockAll=true; this.exit(); return App.openUnit(+ds.id);
      // ── 單元 ──
      case 'newUnit': { const id=Math.max(0,...UNITS.map(u=>u.id))+1; UNITS.push({id,level:'A1',zh:'新單元',en:'New unit',topic:L('','') ,emoji:'📘',grad:GRADS[(id-1)%GRADS.length][1],lessons:[],plan:true}); STAGES[id]=defaultStages(); STAGES[id].forEach(s=>{ STAGEBANK['u'+id+'-'+s.key]={unit:id,items:[]}; }); this.persist(); D.uid=id; D.view='unit'; return this.render(); }
      case 'mvUnit': if(mvArr(UNITS,+ds.i,+ds.d)) this.persist(); return this.render(true);
      case 'delUnit': return this.confirm('確定要刪除這個單元嗎？','單元裡的題目與生詞都會一起刪除，無法復原。（建議先「💾 匯出內容」備份）',()=>{ const id=+ds.id; const i=UNITS.findIndex(u=>u.id===id); UNITS.splice(i,1); delete STAGES[id]; Object.keys(STAGEBANK).filter(k=>k.startsWith('u'+id+'-')).forEach(k=>delete STAGEBANK[k]); for(let k=VOCAB.length-1;k>=0;k--) if(VOCAB[k].u===id) VOCAB.splice(k,1); this.persist(); this.render(); });
      case 'convert': { const id=+ds.id, u=UNITS.find(x=>x.id===id); u.plan=true; u.lessons=[]; STAGES[id]=defaultStages(); STAGES[id].forEach(s=>{ STAGEBANK['u'+id+'-'+s.key]={unit:id,items:[]}; }); STAGEBANK['u'+id+'-vl'].items=VOCAB.filter(v=>v.u===id).map(v=>({t:'flip',v:v.id})); this.persist(); return this.render(); }
      // ── 題目清單 ──
      case 'newItem': return this.startItem($('#dvNewType').value);
      case 'addAllFlip': { const b=this.bank(); VOCAB.filter(v=>v.u===D.uid).forEach(v=>{ if(!b.items.some(x=>x.t==='flip'&&x.v===v.id)) b.items.push({t:'flip',v:v.id}); }); this.persist(); return this.render(true); }
      case 'editItem': D.idx=+ds.i; D.item=this.toForm(this.bank().items[D.idx]); D.view='item'; return this.render();
      case 'dupItem': { const b=this.bank(), i=+ds.i; b.items.splice(i+1,0,JSON.parse(JSON.stringify(b.items[i]))); this.persist(); return this.render(true); }
      case 'delItem': return this.confirm('確定要刪除這一題嗎？','',()=>{ this.bank().items.splice(+ds.i,1); this.persist(); this.render(true); });
      case 'mvItem': if(mvArr(this.bank().items,+ds.i,+ds.d)) this.persist(); return this.render(true);
      case 'prevStage': return this.preview(this.bank().items);
      // ── 單一題目的表單 ──
      case 'saveItem': { const r=this.fromForm(D.item); if(r.err) return App.toast('⚠ '+r.err); const b=this.bank(); if(D.idx===null) b.items.push(r.it); else b.items[D.idx]=r.it; this.persist(); D.view='stage'; D.item=null; this.render(); return App.toast('✓ 已儲存'); }
      case 'prevItem': { const r=this.fromForm(D.item); if(r.err) return App.toast('⚠ '+r.err); return this.preview([r.it]); }
      case 'add': { const it=D.item, p=ds.p; if(!Array.isArray(getBy(it,p))) setBy(it,p,[]); getBy(it,p).push(JSON.parse(ds.def)); if(p==='opts'&&it._c) it._c.push(false); return this.render(true); }
      case 'rm': { const it=D.item, p=ds.p, i=+ds.i; getBy(it,p).splice(i,1); if(p==='opts'){ if(it._c) it._c.splice(i,1); if(typeof it._a==='number'){ if(it._a===i) it._a=null; else if(it._a>i) it._a--; } } return this.render(true); }
      case 'mv': mvArr(getBy(D.item,ds.p),+ds.i,+ds.d); return this.render(true);
      // ── 生詞 / 口說 ──
      case 'newVocab': { let n=1; while(VOCAB.some(v=>v.id==='v'+n)) n++; VOCAB.push({id:'v'+n,u:D.fv!=='all'?+D.fv:UNITS[0].id,han:'',py:'',pos:'',en:'',ex:'',exPy:'',exEn:''}); this.persist(); return this.render(true); }
      case 'delVocab': { const v=VOCAB[+ds.i], n=this.usedBy('vocab',v.id); if(n) return App.toast(`這個生詞正在被 ${n} 張字卡使用，請先刪除那些字卡`); return this.confirm('確定要刪除這個生詞嗎？','',()=>{ VOCAB.splice(+ds.i,1); this.persist(); this.render(true); }); }
      case 'newSpeech': { let n=1; while(SPEECH.some(s=>s.id==='sp'+n)) n++; SPEECH.push({id:'sp'+n,han:'',words:[],py:'',en:'',audio:ASSETS.audio+'sp_'+String(SPEECH.length+1).padStart(2,'0')+'.mp3'}); this.persist(); return this.render(true); }
      case 'delSpeech': { const s=SPEECH[+ds.i], n=this.usedBy('speech',s.id); if(n) return App.toast(`這個句子正在被 ${n} 個「發音」題使用，請先刪除那些題目`); return this.confirm('確定要刪除這個句子嗎？','',()=>{ SPEECH.splice(+ds.i,1); this.persist(); this.render(true); }); }
      // ── 匯出 / 匯入 / 還原 ──
      case 'export': return this.download('huaban-content-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(currentContent(),null,1),'application/json');
      case 'import': return $('#dvFile').click();
      case 'html': return this.downloadHtml();
      case 'reset': return this.confirm('還原成檔案裡原本的內容？','你在這台電腦上的所有編輯都會消失（如果已「下載更新後的 index.html」，就會回到那一份的內容）。建議先匯出備份。',()=>{ try{ localStorage.removeItem(CONTENT_KEY); }catch(e){} location.reload(); });
    }
  },
  startItem(type){ const D=this.D; D.item=this.blank(type); D.idx=null; D.view='item'; this.render(); },

  // download：讓瀏覽器下載一個檔案
  download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); },
  // doImport：讀取 .json 內容檔並套用
  doImport(inp){
    const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const c=JSON.parse(rd.result); if(!c||!Array.isArray(c.units)||!Array.isArray(c.vocab)||!c.stages||!c.bank) throw 0;
        this.confirm('匯入這份內容？','目前這台電腦上的編輯內容會被取代。（學生的學習進度不受影響）',()=>{ applyContent(c); this.D.view='units'; this.persist(); this.render(); App.toast('✓ 已匯入'); });
      }catch(e){ App.toast('⚠ 這不是正確的內容檔'); } inp.value=''; };
    rd.readAsText(f);
  },
  // downloadHtml：把目前 index.html 的畫面「清乾淨」，並把你編輯的內容寫進去，下載成新的 index.html
  downloadHtml(){
    try{
      const clone=document.documentElement.cloneNode(true), q=s=>clone.querySelector(s);
      ['#view','#unitLayer','#devLayer','#lsBody','#nav'].forEach(s=>{ const e=q(s); if(e) e.innerHTML=''; });
      ['lsPrev','lsMain','lsHp','mTitle','mBody','mOk','mCancel'].forEach(id=>{ const e=q('#'+id); if(e) e.textContent=''; });
      clone.querySelectorAll('.open').forEach(e=>e.classList.remove('open'));
      const nav=q('#nav'); if(nav) nav.style.display='';
      const bar=q('#lsBar'); if(bar) bar.removeAttribute('style'); const ft=q('#lsFoot'); if(ft) ft.removeAttribute('style');
      const fb=q('#lsFb'); if(fb){ fb.className='fb'; fb.setAttribute('style','display:none'); fb.innerHTML=''; }
      const au=q('#stdAudio'); if(au) au.removeAttribute('src');
      clone.querySelectorAll('head style').forEach((st,i)=>{ if(i>0) st.remove(); });   // 去掉 Tailwind 自己加進來的樣式（開啟時會重新產生）
      const cj=q('#contentJSON'); cj.textContent=JSON.stringify(currentContent()).replace(/</g,'\\u003c');
      let out=''; document.childNodes.forEach(n=>{ if(n.nodeType===10) out+='<!DOCTYPE html>\n'; else if(n.nodeType===8) out+='<!--'+n.data+'-->\n'; else if(n===document.documentElement) out+=clone.outerHTML; });
      this.download('index.html',out,'text/html'); App.toast('✓ 已下載新的 index.html');
    }catch(e){ App.toast('⚠ 下載失敗，請改用「💾 匯出內容」'); }
  }
};

// ── 程式的最後：把按鈕接上功能，然後第一次畫出首頁 ──
$('#lsExit').onclick=()=>Lesson.exit();
$('#lsPrev').onclick=()=>Lesson.go(-1);
$('#lsMain').onclick=()=>Lesson.main();
document.documentElement.lang = S.lang==='zh'?'zh-Hant':'en';
App.render();
DevMode.init();   // 啟動開發者模式（綁定按鈕；網址有 #dev 時直接進入）
</script>
</body>
