<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════╗
║  huaban 華伴　華語教學 APP　新手導覽（請先讀這一段）              ║
╚══════════════════════════════════════════════════════════════════╝

【這個檔案是什麼】
整個 APP 只有「這一個 index.html」。用瀏覽器直接打開就能玩。
檔案由三大塊組成，由上到下：
  1. <style>   ……畫面長相（顏色、按鈕、卡片、翻轉動畫）
  2. <body>    ……畫面的「空框架」（真正的內容是 JavaScript 在執行時填進去的）
  3. <script>  ……所有功能與所有教材內容（程式碼 + 題目都在這裡）

【★ 不想碰程式碼？用「開發者模式」★】
  畫面右下角有一個 🛠 按鈕（或網址後面加 #dev），按下去就能在網頁上：
    新增／修改單元、生詞、口說句子，以及各種題目（單選、填空、配對、聽力、排序…）。
  做完按右上角「▶ 結束並測試」就能用學生的角度試玩。
  成果請按「⬇ 下載更新後的 index.html」存成新檔案（或「💾 匯出內容」分享給組員）。
  發布給學生前，把 script 開頭的 DEV_ENABLED 改成 false，🛠 就不會出現。

【最常需要改的地方（用 Ctrl+F 搜尋「關鍵字」就能找到）】
  我想…                         搜尋這個關鍵字
  ─────────────────────────────────────────────────────────
  改／新增「生詞」               const VOCAB
  改「單元」名稱、圖示           const UNITS
  改／新增「題目」               const STAGEBANK
  改單元裡「步驟」的名稱         const STAGES
  新增一個「單元」               如何新增一個單元
  改口說練習的句子               const SPEECH
  放音檔／圖片／Logo             const ASSETS
  改介面文字（按鈕、標題）       const I18N
  改顏色                         :root{  （檔案最上面 style 裡）

【script 裡的順序（用 Ctrl+F 搜尋「=====」可跳到每一章）】
  0. 資源路徑      圖片、音檔放哪裡
  1. 多語系        所有介面文字（中文 / 英文）
  2. 內容資料      ★ 生詞、單元、口說句子（老師主要改這裡）
  2b.單元教學流程  ★ 每個單元的 5 個步驟與所有題目（老師主要改這裡）
  3. 狀態          記錄學生進度（存在瀏覽器 localStorage）
  4. 音訊          播放聲音
  5. 口說模組      錄音 + 辨識 + 比對（獨立模組，一般不需要改）
  6. 彈出視窗      「確定要離開嗎？」之類的確認框
  7. 課程引擎      ★ 一題一題出題、批改、算分（含各種題型的畫面）
  8. 頁面          首頁、詞彙庫、口說、複習、個人
  9. App 控制器    切換頁面、開啟單元、開始練習
  10.開發者模式    ★ 網頁上的教材編輯器（新增單元／題目，不用寫程式）
  （2c 內容儲存載入：開發者模式的存檔機制）

【給初學者的小提醒】
  ‧ 改完請存檔，再用瀏覽器「重新整理」就能看到結果。
  ‧ 只改「引號 ' ' 裡面的文字」是最安全的。不要刪掉逗號、括號、引號。
  ‧ 每一筆資料之間要有逗號「,」，最後一筆後面可以有也可以沒有。
  ‧ 改壞了？按 F12 打開「Console」，紅字會告訴你哪一行出錯。
  ‧ 想重置自己的進度：到 APP 的「我的」→「清除本機學習紀錄」。
-->

<!--

<script>
/* =====================================================================
   0. 資源路徑設定（替換圖片與音檔只需改這裡或直接替換檔案）
   【功能】告訴程式「圖片」「音檔」放在哪個資料夾。
   【怎麼用】把檔案放進對應資料夾，檔名照規則取，就會自動被讀到。
   【例子】assets/images/unit1.png 會顯示成單元 1 的封面圖。
   ===================================================================== */
const ASSETS = {
  logo:   'assets/logo.png',        // 【Logo 放置區】
  images: 'assets/images/',         // 【單元/課程插圖放置區】 unit1.png, unit2.png ...
  audio:  'assets/audio/'           // 【標準語音錄音放置區】
};
const STORE_KEY = 'huaban_v1';
const DAILY_GOAL = 50;
// DEV_ENABLED：是否開放「開發者模式」（🛠 按鈕）。★發布給學生前，請改成 false★
const DEV_ENABLED = true;
// DEV.unlockAll：開發者測試時，可暫時解鎖所有單元與步驟（在開發者模式上方勾選）
const DEV = {unlockAll:false};

/* =====================================================================
   1. 多語系
   【功能】APP 裡所有「按鈕、標題、提示」的文字，中文(zh)與英文(en)各一份。
   【怎麼用】想改某個按鈕的字：搜尋它現在的字，把引號裡的文字改掉即可。
   【新增文字】zh 和 en 兩邊都要加同一個「名稱」(key)，程式用 t('名稱') 取用。
   【注意】題目內容不在這裡，題目在「2b」。
   ===================================================================== */
const L = (zh, en) => ({ zh, en });
const I18N = {
 zh:{nav_home:'學習',nav_vocab:'詞彙',nav_speech:'口說',nav_review:'複習',nav_me:'我的',
  welcome:'歡迎回來，繼續加油！',level:'級別',streak:'連續天數',days:'天',daily:'每日學習目標',today_review:'今日待複習',items:'項',go_review:'前往複習',

/* =====================================================================
   2b. 單元教學流程（Unit Plan）
   每個單元分成依序解鎖的步驟：單字學習 → 單字練習 → 文法學習 → 文法練習 → 閱讀測驗
   ===================================================================== */
// ================================================================
//  如何新增一個單元（以「單元二」為例，共 4 步）
// ================================================================
//  步驟 1：在 const UNITS 裡，把單元二那一筆改成：
//          lessons:[], plan:true
//          （plan:true 的意思是：這個單元使用「5 步驟教學流程」）
//
//  步驟 2：在 const VOCAB 裡，加入單元二的生詞（u:2），並記下它們的 id。
//          例：{id:'v8', u:2, han:'水', py:'shuǐ', pos:'n.', en:'water',
//               ex:'我想喝水。', exPy:'Wǒ xiǎng hē shuǐ.', exEn:'I want to drink water.'}
//
//  步驟 3：在下面的 const STAGES 加一組「2:[ ... ]」，內容複製單元一那 5 個步驟，
//          把 title / desc 改成單元二的。key 不要改（vl、vp、gl、gp、rd）。
//
//  步驟 4：在 const STAGEBANK 加 5 組題目，名字固定是 'u2-vl'、'u2-vp'、'u2-gl'、'u2-gp'、'u2-rd'。
//          （u2 代表單元 2；vl=單字學習、vp=單字練習、gl=文法學習、gp=文法練習、rd=閱讀）
//          題目怎麼寫，請看下面「題型範本」。
//
//  完成！重新整理，單元二就有完整的 5 步驟了。
//  單元會「依序解鎖」：單元一全部完成，單元二才會打開。
//
// ================================================================
//  步驟的順序與意義（為什麼是這個順序）
// ================================================================
//  ① 單字學習 vl → ② 單字練習 vp → ③ 文法學習 gl → ④ 文法練習 gp → ⑤ 閱讀測驗 rd
//  「先學、再練」：學生看過字卡才做單字題；看過文法說明才做文法題；最後用閱讀綜合應用。
//  每一步要完成才會解鎖下一步（程式在 stageUnlocked 判斷）。
const G_V=L('① 單字','① Vocabulary'), G_G=L('② 文法','② Grammar'), G_R=L('③ 閱讀','③ Reading');
// STAGES：每個單元「有哪些步驟」。這裡只放步驟的名稱、說明、圖示；題目在下面的 STAGEBANK。
// 每個步驟的欄位：
//   key   ：步驟代號（vl / vp / gl / gp / rd），不要亂改，題目庫的名字會用到它
//   icon  ：顯示在按鈕上的 emoji 圖示
//   group ：分組標題（① 單字 / ② 文法 / ③ 閱讀）
//   title ：步驟名稱（L('中文','English')）
//   desc  ：一句話說明
//   gids  ：（選填）這一步練習了哪些文法點。學生答錯時，會被加進「複習中心」的文法清單
//   after ：（選填）完成後顯示的「已解鎖下一步」文字
const STAGES = {
 1:[
  {key:'vl',icon:'🃏',group:G_V,title:L('單字學習','Learn the words'),desc:L('翻轉字卡：漢字・發音・意思・例句','Flip cards: character, sound, meaning, example'),after:L('🔓 已解鎖下一步：單字練習','🔓 Unlocked: Word practice')},
  {key:'vp',icon:'✏️',group:G_V,title:L('單字練習','Word practice'),desc:L('選擇・配對・填空・聽力・發音','Choice, matching, fill-in, listening, speaking'),after:L('🔓 已解鎖下一步：文法學習','🔓 Unlocked: Grammar lesson')},
  {key:'gl',icon:'📘',group:G_G,title:L('文法學習','Learn the grammar'),desc:L('用法說明與例句','How it works, with examples'),after:L('🔓 已解鎖下一步：文法練習','🔓 Unlocked: Grammar practice')},
  {key:'gp',icon:'🧩',group:G_G,title:L('文法練習','Grammar practice'),desc:L('選擇・填空・排序・發音','Choice, fill-in, ordering, speaking'),gids:['g1','g1n'],after:L('🔓 已解鎖下一步：閱讀測驗','🔓 Unlocked: Reading quiz')},
  {key:'rd',icon:'📖',group:G_R,title:L('閱讀測驗','Reading quiz'),desc:L('短文與對話，回答問題','Short text and dialogue with questions')}
 ]
};
Object.keys(STAGES).forEach(u=>STAGES[u].forEach(st=>st.id='u'+u+'-'+st.key));

// STAGEBANK：「題目庫」。格式是： '單元-步驟名':{ unit:單元編號, items:[ 題目, 題目, ... ] }
// 學生會「照 items 的順序」一題一題做。想調整順序，就調整題目的排列。
//
// ─────────────── 題型範本（直接複製，改裡面的字就能用）───────────────
//  ※ 每題後面要加逗號「,」。L('中文','English') 是中英文各一份。
//  ※ 欄位 v:'v1' 是「這題考的生詞 id」，答對/答錯會影響該字的熟悉度（可省略）。
//  ※ exp 是答完後出現的「解釋」（可省略）。
//
//  1) 單字字卡（只能用在「單字學習」）  {t:'flip', v:'v1'}
//     → 會顯示 VOCAB 裡 id 為 v1 的字卡，學生要翻面才能繼續。
//
//  2) 單選題        MC(題目, [選項1,選項2,選項3], 正確答案是第幾個(從0開始), 解釋, 'v1')
//     例：MC(L('「謝謝」是什麼意思？','…'), ['Thank you','Goodbye'], 0, L('解釋','…'), 'v2')
//     注意：第 3 個數字 0 代表「第一個選項」是正確答案（電腦從 0 開始數）。
//
//  3) 填空題        {t:'fill', q:'見面時，我說「___」。', opts:['再見','你好'], ans:'你好', exp:L(..), v:'v1'}
//     注意：題目裡要有三個底線 ___ ，那裡就是空格。ans 必須和 opts 其中一個「完全一樣」。
//
//  4) 配對題        {t:'match', q:L('把漢字與英文配對','…'), pairs:[['你好','hello'],['謝謝','thank you']]}
//     每一組 ['左邊','右邊'] 就是一對。配對題答錯一次就算整題不完美，但仍要全部配完才能繼續。
//
//  5) 聽力題        {t:'listen', q:L('你聽到的是哪一個詞？','…'), say:'謝謝', audio:A+'u1_listen1.mp3',
//                    opts:['你好','謝謝','再見'], ans:1, exp:L(..), v:'v2'}
//     say 是「沒有音檔時，用電腦朗讀的字」；audio 是音檔名稱（放在 assets/audio）。ans:1 代表第 2 個選項。
//
//  6) 輸入題        {t:'type', q:'我是 ___。', hint:'student・xuéshēng', ans:['學生','xuesheng','xuéshēng'], exp:L(..)}
//     ans 是一個清單：[0]=漢字答案、[1]=不含聲調的拼音、[2]=含聲調的拼音。
//     學生輸入「學生」或「xuesheng」都算對（程式會自動忽略聲調與空格）。
//
//  7) 排序題        {t:'order', en:L('Hello, teacher.','…'), tokens:['老師','你好'], extra:['謝謝'],
//                    ans:'老師你好', py:{'老師':'lǎoshī','你好':'nǐ hǎo','謝謝':'xièxie'}, exp:L(..)}
//     tokens 是「正確要用的詞」，extra 是「干擾用的多餘詞」。ans 是把正確的詞「直接連起來」的答案。
//     py 是每個詞下方顯示的拼音（可省略）。
//
//  8) 多選題        {t:'multi', q:L('選出所有…（可多選）','…'), opts:['A','B','C','D'], ans:[0,1], exp:L(..)}
//     ans 是「所有正確選項的位置」，例如 [0,1] 代表第 1、2 個都要選。
//
//  9) 發音（口說）  {t:'speak', sid:'sp2'}
//     sid 是 SPEECH 裡的句子 id。要新增口說句子，請到 const SPEECH 加一筆。
//
// 10) 文法說明（只能用在「文法學習」）
//     {t:'grammar', gid:'g1', title:L('「是」：說明身分','…'), body:L('說明文字','…'),
//      formula:'主詞 + 是 + 名詞', tip:L('小提醒','…'),
//      ex:[['我是學生。','Wǒ shì xuéshēng.','I am a student.'], ... ]}

/* =====================================================================
   2c. 內容的儲存與載入（給「開發者模式」使用）
   【功能】開發者模式裡編輯的內容，會存在瀏覽器（localStorage 的 huaban_content_v1），
           下次打開網頁時自動載入，覆蓋上面「2、2b」寫死的內容。
   【載入順序】① 程式碼內建（上面的 UNITS、VOCAB…）
              ② 檔案裡的 contentJSON（「⬇ 下載更新後的 index.html」寫進去的）
              ③ 瀏覽器 localStorage 的編輯內容
              ②③ 取「較新」的那一份。
   【一般不需要改這一段】
   ===================================================================== */
const CONTENT_KEY = 'huaban_content_v1';
// snapshotContent：把目前所有教材（單元、生詞、口說、步驟、題目）拍成一份可存檔的資料
function snapshotContent(){
  return JSON.parse(JSON.stringify({v:1,savedAt:0,units:UNITS,
    vocab:VOCAB.map(v=>{ const c=Object.assign({},v); delete c.audio; delete c.lv; return c; }),
    speech:SPEECH,stages:STAGES,bank:STAGEBANK}));
}
const currentContent = () => { const c=snapshotContent(); c.savedAt=Date.now(); return c; };
function saveContent(){ try{ localStorage.setItem(CONTENT_KEY,JSON.stringify(currentContent())); }catch(e){} }
// rebuildDerived：重新計算「由別的資料推算出來」的東西：生詞音檔檔名、級別、步驟 id、文法清單
function rebuildDerived(){
  const cnt={};
  VOCAB.forEach(v=>{ cnt[v.u]=(cnt[v.u]||0)+1; v.audio=`${ASSETS.audio}u${v.u}_vocab${cnt[v.u]}.mp3`; const un=UNITS.find(x=>x.id===v.u); v.lv=un?un.level:'A1'; });
  Object.keys(STAGES).forEach(u=>STAGES[u].forEach(st=>{ st.id='u'+u+'-'+st.key; }));
  Object.keys(GRAMMAR).forEach(k=>delete GRAMMAR[k]);
  Object.keys(LESSONS).forEach(lid=>LESSONS[lid].items.forEach(it=>{ if(it.t==='grammar') GRAMMAR[it.gid]=it; }));
  Object.values(STAGEBANK).forEach(b=>b.items.forEach(it=>{ if(it.t==='grammar') GRAMMAR[it.gid]=it; }));
}
// applyContent：把一份內容套用到程式裡（直接替換 UNITS、VOCAB… 的內容）
function applyContent(c){
  UNITS.length=0; c.units.forEach(u=>UNITS.push(u));
  VOCAB.length=0; c.vocab.forEach(v=>VOCAB.push(v));
  SPEECH.length=0; (c.speech||[]).forEach(x=>SPEECH.push(x));
  Object.keys(STAGES).forEach(k=>delete STAGES[k]); Object.keys(c.stages).forEach(k=>{ STAGES[k]=c.stages[k]; });
  Object.keys(STAGEBANK).forEach(k=>delete STAGEBANK[k]); Object.keys(c.bank).forEach(k=>{ STAGEBANK[k]=c.bank[k]; });
  rebuildDerived();
}
// 啟動時：載入較新的那一份內容
(function(){
  let emb=null, loc=null;
  try{ emb=JSON.parse(document.getElementById('contentJSON').textContent); }catch(e){}
  try{ loc=JSON.parse(localStorage.getItem(CONTENT_KEY)); }catch(e){}
  const pick=[emb,loc].filter(x=>x&&Array.isArray(x.units)&&x.bank).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0))[0];
  if(pick) applyContent(pick);
})();



/* =====================================================================
   3. 狀態 / localStorage
   【功能】記住學生的進度：XP、連續天數、完成哪些步驟、答錯哪些題、單字熟悉度。
   【原理】資料存在瀏覽器的 localStorage（存在學生自己的手機/電腦，不會上傳）。
   【變數 S】整個 APP 的「進度本」。S.xp 是經驗值，S.stages 是已完成的步驟…
   【什麼時候改】新增功能要多記一種資料時，才需要動 defaults（預設值）。
   【下面的小工具】$、shuffle、plain 是全站共用的小幫手，不用改。
   ===================================================================== */
// 把時間轉成「年-月-日」文字，用來判斷「今天」「昨天」（算連續天數、每日目標）
function dstr(ts){ return new Date(ts||Date.now()).toLocaleDateString('en-CA'); }
// 進度本 S 的「預設值」（全新使用者的樣子）。
// 想多記一種資料（例如新功能），就在這裡加一個欄位。
//   lang 介面語言   xp 總經驗值   dailyXp 今天的經驗值   streak 連續天數
//   done 舊版已完成的課   stages ★新版已完成的步驟（'1:vl' 代表單元1的單字學習）
//   vocab 每個生詞的熟悉度   wrong 答錯的題目   grammar 需要重練的文法
//   speech 口說紀錄   history 最近學習紀錄   quiz 累計答題數
const defaults = () => ({lang:'zh',xp:0,dailyXp:0,dailyDate:dstr(),streak:0,lastDay:null,done:{},stages:{},vocab:{},wrong:{},grammar:{},speech:{},history:[],quiz:{c:0,t:0},lastLesson:null});
// 開啟網頁時：從瀏覽器 localStorage 讀回上次的進度；讀不到就用預設值
function load(){ try{ const r=JSON.parse(localStorage.getItem(STORE_KEY)); return Object.assign(defaults(), r||{}); }catch(e){ return defaults(); } }
let S = load();
// 把目前進度 S 存進瀏覽器。每次進度有變動（答題、完成步驟）都會呼叫它
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

// 小幫手：$('#id') 等於 document.querySelector('#id')，用來找到畫面上的元素
const $ = s => document.querySelector(s);
// 小幫手：把清單隨機打亂（配對題、排序題用）
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
// 小幫手：用 id 找到生詞（vById('v1') 會回傳「你好」那筆資料）／用 id 找到單元
const vById = id => VOCAB.find(v=>v.id===id);
const unitById = id => UNITS.find(u=>u.id===id);
// 小幫手：把拼音的聲調、空格去掉並轉小寫，所以學生輸入 xuesheng 也能對上 xuéshēng
const plain = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'').toLowerCase();

// 跨日時，把「今天的 XP」歸零
function rollDaily(){ if(S.dailyDate!==dstr()){ S.dailyDate=dstr(); S.dailyXp=0; } }
// 更新「連續學習天數」：昨天有學 → +1；中斷了 → 從 1 重新算
function touchStreak(){ const td=dstr(); if(S.lastDay===td) return; const y=dstr(Date.now()-864e5); S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=td; }
// 增加經驗值 XP（同時更新每日目標與連續天數，並存檔）
function addXp(n){ rollDaily(); S.xp+=n; S.dailyXp+=n; touchStreak(); save(); }
function streakNow(){ const td=dstr(), y=dstr(Date.now()-864e5); return (S.lastDay===td||S.lastDay===y)?S.streak:0; }

// ── 單元／步驟 的「完成」與「解鎖」判斷 ──
// lessonDone  ：舊版某堂課是否完成（單元二到五用）
const lessonDone = lid => !!S.done[lid];
// unitDone：單元是否全部完成。plan 單元看「5 個步驟是否都完成」，舊單元看「所有課是否完成」
const unitDone = u => u.plan ? STAGES[u.id].every(st=>stageDone(u.id,st.key)) : u.lessons.every(lessonDone);
// unitUnlocked：單元是否解鎖。第一個單元永遠開放；其他單元需要「前一個單元完成」
const unitUnlocked = u => { if(DEV.unlockAll) return true; const i=UNITS.indexOf(u); return i===0 || unitDone(UNITS[i-1]); };
// lessonUnlocked：舊版課程是否解鎖（前一堂課完成才打開）
const lessonUnlocked = (u,lid) => { if(DEV.unlockAll) return true; if(!unitUnlocked(u)) return false; const k=u.lessons.indexOf(lid); return k===0 || lessonDone(u.lessons[k-1]); };
// unitStatus：單元狀態文字，給首頁顯示徽章用（done 完成 / prog 進行中 / lock 未解鎖）
const unitStatus = u => unitDone(u)?'done':(!unitUnlocked(u)?'lock':'prog');
// curLevel：目前級別。A1 單元全部完成就變成 A2
const curLevel = () => UNITS.filter(u=>u.level==='A1').every(unitDone)?'A2':'A1';
// nextLesson：找出「下一個該學的」步驟或課程，首頁的「繼續學習」卡片使用
function nextLesson(){ for(const u of UNITS){ if(u.plan){ const st=STAGES[u.id].find(x=>!stageDone(u.id,x.key)); if(st) return {u,stage:st}; continue; } for(const l of u.lessons) if(!lessonDone(l)) return {u,lid:l}; } return null; }
const nlTitle = nl => nl.stage ? nl.stage.title : LESSONS[nl.lid].title;

/* 詞彙熟悉度（間隔複習：fam 0~5 → 下次複習天數） */
const FAM_DAYS = [0,1,2,4,7,14];
const getV = id => S.vocab[id] || {fam:0,review:false,seen:false,due:0};
function ensureV(id){ if(!S.vocab[id]) S.vocab[id]={fam:0,review:false,seen:false,due:0}; return S.vocab[id]; }
// markSeen：學生看過某個生詞後，標記為「已看過」並安排第一次複習時間
function markSeen(id){ const s=ensureV(id); if(!s.seen){ s.seen=true; s.fam=Math.max(1,s.fam); s.due=Date.now()+FAM_DAYS[1]*864e5; save(); } }
// vocabResult：答題後更新單字熟悉度。答對 fam+1，答錯 fam-1 並加入複習清單
function vocabResult(id,ok){ const s=ensureV(id); s.seen=true; if(ok){ s.fam=Math.min(5,s.fam+1); s.due=Date.now()+FAM_DAYS[s.fam]*864e5; } else { s.fam=Math.max(0,s.fam-1); s.review=true; s.due=Date.now(); } }
// dueVocab：找出「現在該複習」的單字（複習中心使用）
function dueVocab(){ const now=Date.now(); return VOCAB.filter(v=>{ const s=S.vocab[v.id]; return s && (s.review || (s.seen && s.fam<5 && s.due<=now)); }); }
// wrongList：目前「還沒訂正」的錯題清單（題目找不到的舊紀錄會自動忽略）
const wrongList = () => Object.values(S.wrong).filter(w=>!w.resolved && (LESSONS[w.lid]||STAGEBANK[w.lid]));
const grammarList = () => Object.keys(S.grammar).filter(g=>S.grammar[g] && GRAMMAR[g]);
const speechTodo = () => SPEECH.filter(s=>!(S.speech[s.id] && S.speech[s.id].passes>0));
// reviewCount：複習中心的待辦總數（錯題 + 單字 + 文法），顯示在導覽列紅點
const reviewCount = () => wrongList().length + dueVocab().length + grammarList().length;

/* =====================================================================
   4. 音訊：優先播放 assets/audio，找不到時改用 Web Speech API
   【功能】播放聲音。先找 assets/audio 裡的 mp3；找不到就用瀏覽器內建語音朗讀。
   【好處】還沒錄音檔也能先測試；之後把 mp3 放進去就自動換成真人錄音。
   ===================================================================== */
// speakText：用瀏覽器內建語音朗讀一段文字（台灣華語 zh-TW、速度 0.85 較慢）
function speakText(text){ try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=.85; speechSynthesis.speak(u); }catch(e){} }
// unlockSpeech：手機（iPhone、部分安卓）只允許「使用者點擊的那一瞬間」啟動語音朗讀。
// 這裡在點擊當下先「空講」一次，之後的朗讀（包括音檔失敗後的替代朗讀）才能正常出聲。
function unlockSpeech(){
  try{ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='zh-TW'; speechSynthesis.speak(u); }catch(e){}
}
// 任何一次點擊或點下去，都先解鎖語音（只需要做一次也可以，做多次也無妨）
// iPhone Safari 只把 touchend / click 視為使用者點擊，所以兩個都要監聽
// SoundTest：聲音診斷工具（開發者模式上方的「🔊 測試聲音」按鈕會呼叫它）
// 功能：直接在點擊當下朗讀一句話，並顯示手機抓到的中文語音與任何錯誤訊息。
const SoundTest = {
  run(){
    const out=document.getElementById('stOut');
    const log=m=>{ if(out) out.textContent+=m+'\n'; };
    if(out) out.textContent='';
    if(!('speechSynthesis' in window)){ log('❌ 這個瀏覽器不支援語音朗讀'); return; }
    const vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));
    log('中文語音數量：'+vs.length+(vs.length?'（'+vs.map(v=>v.name+' '+v.lang).join('、')+'）':'（找不到，將用系統預設語音）'));
    log('語音狀態：'+(speechSynthesis.speaking?'忙碌中':'閒置'));
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('你好，這是語音測試。');
    u.lang='zh-TW'; u.rate=.85; u.volume=1;
    if(vs.length) u.voice=vs[0];
    u.onstart=()=>log('✓ 開始朗讀（如果沒聽到聲音，請檢查靜音撥鈕與音量）');
    u.onend=()=>log('✓ 朗讀結束');
    u.onerror=e=>log('❌ 朗讀錯誤：'+(e.error||'未知'));
    speechSynthesis.speak(u);
    log('已送出朗讀指令…');
  }
};
document.addEventListener('touchend', unlockSpeech, {passive:true});
document.addEventListener('click', unlockSpeech);
// playStd：先播放 path 的音檔；播不出來（檔案不存在）就改用 speakText 朗讀 text
function playStd(path, text){
  const a=$('#stdAudio'); let fell=false; const fb=()=>{ if(fell) return; fell=true; speakText(text); };
  try{ a.pause(); }catch(e){}
  unlockSpeech();   // 在點擊當下先解鎖語音，確保音檔播不出來時，替代朗讀也能發聲
  if(!path){ fb(); return; }
  a.onerror=fb; a.src=path;
  const p=a.play(); if(p && p.catch) p.catch(fb);
}

/* =====================================================================
   5. 獨立模組：SpeechPracticeModule（語音辨識 + 比對，與畫面渲染分離）
   【功能】口說練習：錄音 → 語音辨識成文字 → 和標準句子逐字比對 → 給通過/不通過。
   【提醒】這一章比較難，且已自成一個模組。一般新增題目/單元【不需要】改這裡。
   【限制】語音辨識需要 Chrome / Edge，且網址是 https 或 localhost。
   ===================================================================== */
const SpeechPracticeModule = (function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const SIMP = {'学':'學','师':'師','谢':'謝','饭':'飯','车':'車','钱':'錢','个':'個','气':'氣','买':'買','贵':'貴','热':'熱','这':'這','见':'見','对':'對','说':'說','运':'運','们':'們','么':'麼','两':'兩','吗':'嗎','爱':'愛','来':'來','时':'時','会':'會','样':'樣','钟':'鐘','杯':'杯','岁':'歲','点':'點','还':'還','没':'沒','认':'認','识':'識'};
  let rec=null, finalText='', interimText='';
  let cfg={ store:()=>({}), persist:()=>{}, onActivity:()=>{} };
  const api = {
    supported: !!SR,
    configure(c){ cfg=Object.assign(cfg,c); },
    /* 步驟 4：請求麥克風權限 */
    async requestMic(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
      try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(x=>x.stop()); return true; }catch(e){ return false; }
    },
    /* 步驟 5~6：開始辨識並回傳即時文字 */
    listen(h){
      finalText=''; interimText='';
      rec=new SR(); rec.lang='zh-TW'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
      rec.onstart=()=>h.onState&&h.onState('listening');
      rec.onresult=e=>{ let f='',i=''; for(let k=0;k<e.results.length;k++){ const tr=e.results[k][0].transcript; if(e.results[k].isFinal) f+=tr; else i+=tr; } finalText=f; interimText=i; h.onText&&h.onText(f,i); };
      rec.onerror=e=>{ h.onError&&h.onError(e.error); };
      rec.onend=()=>{ h.onEnd&&h.onEnd((finalText+interimText).trim()); };
      try{ rec.start(); }catch(err){ h.onError&&h.onError('start-failed'); }
    },
    /* 步驟 7：停止錄音，onend 會觸發比對 */
    stop(){ try{ rec&&rec.stop(); }catch(e){} },
    abort(){ try{ if(rec){ rec.onend=null; rec.onerror=null; rec.abort(); } }catch(e){} rec=null; },
    normalize(s){ return Array.from(String(s||'')).map(c=>SIMP[c]||c).filter(c=>!/[\s\u3000-\u303f\uff00-\uffef.,!?;:'"()\-…「」]/.test(c)); },
    /* 步驟 8：逐字（LCS）比對，再彙整成逐詞標示 */
    evaluate(sent,text){
      const tgt=this.normalize(sent.han), rc=this.normalize(text), n=tgt.length, m=rc.length;
      const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
      for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) dp[i][j]= tgt[i-1]===rc[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
      const tm=Array(n).fill(false), rm=Array(m).fill(false); let i=n,j=m;
      while(i>0&&j>0){ if(tgt[i-1]===rc[j-1]){ tm[i-1]=rm[j-1]=true; i--; j--; } else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--; }
      let p=0; const words=sent.words.map(w=>{ const len=Array.from(w).length; const ok=tm.slice(p,p+len).every(Boolean); p+=len; return {w,ok}; });
      const score=n?tm.filter(Boolean).length/n:0;
      return {text, words, score, passed:score>=0.8, extra:rc.filter((c,k)=>!rm[k]).join('')};
    },
    /* 步驟 10：記錄練習次數與通過率 */
    record(sid,passed){ const st=cfg.store(); const r=st[sid]||(st[sid]={attempts:0,passes:0,last:0}); r.attempts++; if(passed) r.passes++; r.last=Date.now(); cfg.persist(); cfg.onActivity(passed); },
    stats(sid){ const r=cfg.store()[sid]||{attempts:0,passes:0}; return {attempts:r.attempts,passes:r.passes,rate:r.attempts?Math.round(r.passes/r.attempts*100):0}; }
  };
  return api;
})();
SpeechPracticeModule.configure({ store:()=>S.speech, persist:save, onActivity:()=>{ touchStreak(); save(); } });

        <div class="text-sm text-slate-400">${sent.en}</div>

      </div>

      <div class="text-center my-4">
        <div class="status" data-r="status"><i></i><span>${t('sp_st_idle')}</span></div><br>
        <button class="mic" data-r="mic" aria-label="mic">🎤</button>
        <div class="text-sm font-bold text-slate-500 mt-3" data-r="lbl">${t('sp_start')}</div>
      </div>
      <div class="card p-4 mb-3"><div class="text-xs font-bold text-slate-400 mb-1">${t('sp_live')}</div><div class="han text-xl min-h-[2rem]" data-r="live">—</div></div>
      <details class="mb-3"><summary>${t('sp_manual')}</summary>
        <div class="flex gap-2 mt-2"><input class="inp" style="font-size:16px" data-r="manual" placeholder="${t('sp_manual_ph')}"><button class="btn btn-blue btn-sm" data-a="manual">${t('sp_manual_btn')}</button></div></details>
      <div data-r="result"></div>`;
    const q=s=>el.querySelector(s), $st=q('[data-r=status]'), $mic=q('[data-r=mic]'), $lbl=q('[data-r=lbl]'), $live=q('[data-r=live]'), $res=q('[data-r=result]');
    const stepIdx={idle:0,requesting:1,listening:2,processing:3,done:4,error:0};
    function setState(s,msg){
      state=s; const map={idle:'sp_st_idle',requesting:'sp_st_req',listening:'sp_st_listen',processing:'sp_st_proc',done:'sp_st_done',error:'sp_st_err'};
      $st.className='status '+(s==='listening'?'listening':s==='done'?'done':s==='error'?'error':''); $st.querySelector('span').textContent=msg||t(map[s]);
      $mic.classList.toggle('rec',s==='listening'); $mic.textContent=s==='listening'?'⏹':'🎤';
      $lbl.textContent=s==='listening'?t('sp_stop'):t('sp_start');
      const k=stepIdx[s]; el.querySelectorAll('.steps span').forEach((x,i)=>{ x.className=i<k?'past':(i===k?'on':''); });
    }
    function showLive(txt){ $live.textContent=txt||'—'; }
    function finish(text){
      if(!text){ setState('error',t('sp_nosound')); return; }
      result=M.evaluate(sent,text); M.record(sent.id,result.passed); setState('done'); renderResult(); onResult&&onResult(result);
    }
    function renderResult(){
      const st=M.stats(sent.id), pct=Math.round(result.score*100);
      $res.innerHTML=`<div class="card p-4 mb-3">
        <div class="font-black text-lg ${result.passed?'text-green-600':'text-red-500'}">${result.passed?t('sp_pass'):t('sp_fail')} <span class="text-sm">(${pct}%)</span></div>
        <div class="text-xs font-bold text-slate-400 mt-3">${t('sp_compare')}</div>
        <div class="han">${result.words.map(w=>`<span class="wchip ${w.ok?'ok':'bad'}">${w.w}${w.ok?'':' ✗'}</span>`).join('')}</div>
        <div class="text-sm mt-2 text-slate-500">${t('sp_you')}：<span class="han">${result.text}</span>${result.extra?` ｜ ${t('sp_extra')}：<b class="text-amber-600 han">${result.extra}</b>`:''}</div>
        <div class="text-xs text-slate-400 mt-2">${t('sp_att')} ${st.attempts} ・ ${t('sp_rate')} ${st.rate}%</div>
        <div class="flex gap-2 mt-3"><button class="btn btn-blue btn-sm flex-1" data-a="replay">🔊 ${t('sp_replay')}</button><button class="btn btn-ghost btn-sm flex-1" data-a="retry">↻ ${t('sp_retry')}</button></div></div>`;
      $res.querySelector('[data-a=replay]').onclick=()=>playStd(sent.audio,sent.han);
      $res.querySelector('[data-a=retry]').onclick=reset;
    }
    function reset(){ M.abort(); result=null; errored=false; $res.innerHTML=''; showLive(''); setState('idle'); onResult&&onResult(null); }
    async function start(){
      result=null; errored=false; $res.innerHTML=''; showLive(''); onResult&&onResult(null);
      if(!M.supported){ setState('error',t('sp_unsupported')); return; }
      setState('requesting');
      const ok=await M.requestMic(); if(!ok){ setState('error',t('sp_denied')); return; }
      M.listen({
        onState:()=>setState('listening'),
        onText:(f,i)=>showLive(f+i),
        onError:e=>{ errored=true; setState('error', (e==='not-allowed'||e==='service-not-allowed')?t('sp_denied'):(e==='no-speech'?t('sp_nosound'):t('sp_err')+' ('+e+')')); },
        onEnd:txt=>{ if(errored) return; setState('processing'); finish(txt); }
      });
    }
    $mic.onclick=()=>{ if(state==='listening') M.stop(); else if(state!=='requesting'&&state!=='processing') start(); };
    q('[data-a=model]').onclick=()=>playStd(sent.audio,sent.han);
    q('[data-a=manual]').onclick=()=>{ const v=q('[data-r=manual]').value.trim(); if(!v) return; showLive(v); setState('processing'); finish(v); };
    setState('idle');
  }
};

/* =====================================================================
   6. Modal
   【功能】彈出確認視窗（例如：「確定要離開課程嗎？」）。Modal.confirm({...}) 就能叫出來。
   ===================================================================== */
const Modal = {
  confirm({title,body,ok,cancel,onOk}){
    $('#mTitle').textContent=title; $('#mBody').textContent=body; $('#mOk').textContent=ok; $('#mCancel').textContent=cancel;
    $('#modal').classList.add('open');
    $('#mCancel').onclick=()=>$('#modal').classList.remove('open');
    $('#mOk').onclick=()=>{ $('#modal').classList.remove('open'); onOk&&onOk(); };
  }
};

/* =====================================================================
   7. 課程引擎（Lesson）與各題型渲染器（Q）
   【功能】這是 APP 的「心臟」。給它一串題目，它會一題一題出給學生，並負責：
           顯示題目 → 學生作答 → 批改 → 扣血量/加 XP → 記錄錯題 → 最後顯示成績。
   【兩個部分】
     (1) Lesson：負責「流程」（下一題、上一題、批改、結束）。
     (2) Q：負責「每一種題型長什麼樣子」。Q.mc 是選擇題、Q.fill 是填空…。
   【新增題型時】在 Q 裡新增 Q.名稱 = (box,it)=>{...}，題目就能用 {t:'名稱',...}。
   【一般只是加題目】不用改這章，到「2b」加題目即可。
   ===================================================================== */
// cur：「目前這一題」的暫存區。每換一題就清空。
//   cur.ans()  ← 每種題型都要提供：回傳學生目前的答案（還沒作答回傳 null）
//   cur.lock() ← 每種題型都要提供：批改後把畫面鎖住並標出對錯
let cur = {};
// NG（Not Graded）：「不計分」的題型 = 教學頁。這些頁面只按「繼續」，不會批改、也不扣血量
const NG = new Set(['vocab','grammar','flip']);

// itemTitle：把一題變成一小段文字，寫進「錯題清單」給學生複習時辨認
function itemTitle(it){
  if(it.t==='match') return tx(it.q)||t('match_q');
  if(it.t==='order') return tx(it.en);
  if(it.t==='speak'){ const s=SPEECH.find(x=>x.id===it.sid); return s?s.han:''; }
  if(it.t==='fill'||it.t==='type') return it.q.replace('___','＿＿');
  return tx(it.q)||'';
}

// Lesson：課程引擎。一次練習 = 一個 Lesson。重要的變數 this.s 是「這次練習的狀態」：
//   entries 題目清單   i 目前第幾題   hp 剩餘血量   res 每題的作答結果   xp 本次經驗值
// 流程：open(開始) → render(畫出一題) → 學生作答 → main(按鈕) → grade(批改) → go(下一題) → … → finish(結算)
const Lesson = {
  s:null,
  //   // startLesson：開始一堂舊版的課（單元二到五）。把 LESSONS 裡的題目包成 entries 交給 open
  startLesson(lid){
    const l=LESSONS[lid]; if(!l) return;
    this.open({id:lid,title:l.title,real:true,entries:l.items.map((item,i)=>({item,ref:[lid,i],key:lid+':'+i}))});
  },
  //   // open：開始一次練習。cfg 重要欄位：entries(題目清單)、title(標題)、
  //   //   stage（若是 5 步驟流程的步驟才有：記錄單元、步驟代號，完成時用來解鎖下一步）
  //   // 這裡會：建立狀態、血量設成 5、打開練習畫面、隱藏下方導覽列
  open(cfg){
    this.s={cfg,entries:cfg.entries,i:0,hp:5,res:[],xp:0,right:0,graded:0,newWrong:0,vids:new Set(),ended:false,hadWrong:false};
    $('#lessonLayer').classList.add('open'); $('#nav').style.display='none'; $('#lsFoot').style.display='block';
    $('#lsPrev').textContent='← '+t('prev'); this.render();
  },
  //   // render：畫出「目前這一題」。依題目的 t（題型）去呼叫 Q[題型] 把畫面畫出來
  render(){
    const s=this.s, e=s.entries[s.i], it=e.item, r=s.res[s.i];
    SpeechPracticeModule.abort(); try{ speechSynthesis.cancel(); }catch(x){}
    const body=$('#lsBody'); body.scrollTop=0; cur={};
    $('#lsBar').style.width=(s.res.filter(Boolean).length/s.entries.length*100)+'%';
    $('#lsHp').textContent='❤️'.repeat(s.hp)+'🤍'.repeat(5-s.hp);
    body.innerHTML='<div id="qbox"></div>';
    const box=$('#qbox'); if(r&&!r.ng) box.classList.add('locked');
    Q[it.t](box,it,r,e);
    if(r&&r.a&&cur.lock) cur.lock(r.a);
    this.sync();
  },
  //   // sync：同步下方主按鈕與回饋區。例如：還沒作答→按鈕灰色；答完→顯示「下一題」；字卡還沒翻面→不能繼續
  sync(){
    const s=this.s; if(!s||s.ended) return;
    const it=s.entries[s.i].item, r=s.res[s.i], main=$('#lsMain'), last=s.i===s.entries.length-1;
    $('#lsPrev').disabled=s.i===0;
    if(r){ main.disabled=false; main.textContent=last?t('finish'):t('next'); }
    else if(NG.has(it.t)){ main.disabled=(it.t==='flip'&&!cur.flipped); main.textContent=t('cont_btn'); }
    else { main.disabled=!(cur.ans&&cur.ans()); main.textContent=t('check'); }
    main.className='btn flex-1 '+((r&&r.fb&&!r.ok)?'btn-red':'btn-primary');
    const fb=$('#lsFb'); if(r&&r.fb){ fb.className='fb '+(r.ok?'ok':'bad'); fb.innerHTML=r.fb; fb.style.display='block'; } else fb.style.display='none';
  },
  //   // main：按下主按鈕時做的事：已作答→下一題；教學頁→直接下一題；其他→批改
  main(){
    const s=this.s, it=s.entries[s.i].item, r=s.res[s.i];
    if(r){ this.go(1); return; }
    if(NG.has(it.t)){ if(it.t==='vocab'||it.t==='flip') markSeen(it.v); s.res[s.i]={ng:true}; this.go(1); return; }
    const a=cur.ans&&cur.ans(); if(!a) return; this.grade(a);
  },
  //   // skip：略過此題（口說題用，不計分）
  skip(){ const s=this.s; s.res[s.i]={ng:true,skipped:true}; this.go(1); },
  //   // grade：批改。對→加 XP、錯題訂正；錯→扣 1 血、記進錯題清單；同時更新單字熟悉度與進度條
  grade(a){
    const s=this.s, e=s.entries[s.i], it=e.item, ok=!!a.correct;
    s.graded++; S.quiz.t++;
    if(ok){ s.right++; S.quiz.c++; s.xp+=10; if(S.wrong[e.key]) S.wrong[e.key].resolved=true; }
    else {
      s.hp--; s.hadWrong=true;
      if(e.ref){ const prev=S.wrong[e.key]; if(!prev||prev.resolved) s.newWrong++; S.wrong[e.key]={key:e.key,lid:e.ref[0],idx:e.ref[1],q:itemTitle(it),ans:a.ans,count:(prev?prev.count:0)+1,resolved:false,at:Date.now()}; }
      else s.newWrong++;
      if(it.v) s.vids.add(it.v);
    }
    if(it.v) vocabResult(it.v,ok);
    const exp=tx(it.exp);
    const fb= ok ? `<b>${t('correct')}</b>${exp?`<div class="sm">${exp}</div>`:''}`
                 : `<b>✗ ${t('wrong')}</b><div>${t('right_ans')}<span class="han">${a.ans}</span></div>${exp?`<div class="sm">${exp}</div>`:''}`;
    s.res[s.i]={ok,fb,a}; save();
    if(cur.lock) cur.lock(a);
    $('#qbox').classList.add('locked');
    $('#lsHp').textContent='❤️'.repeat(Math.max(0,s.hp))+'🤍'.repeat(5-Math.max(0,s.hp));
    $('#lsBar').style.width=(s.res.filter(Boolean).length/s.entries.length*100)+'%';
    this.sync();
  },
  //   // go：換題。d=1 下一題、d=-1 上一題。最後一題（或血量用完）就進入 finish 結算
  go(d){
    const s=this.s;
    if(d>0){ if(s.hp<=0&&s.res[s.i]) return this.finish(true); if(s.i>=s.entries.length-1) return this.finish(false); s.i++; }
    else if(s.i>0) s.i--;
    this.render();
  },
  //   // finish：結算。算正確率 → 發 XP → 若是 5 步驟流程的步驟且沒有血量用完，就記錄「已完成」
  //   //   （S.stages）並解鎖下一步 → 存進歷史紀錄 → 顯示成績畫面
  //   //   教學步驟（字卡、文法說明）沒有計分題，所以不顯示成績數字，只顯示「已解鎖下一步」
  finish(hpOut){
    const s=this.s; s.ended=true; SpeechPracticeModule.abort();
    if(!hpOut) s.xp+=5;
    const acc=s.graded?Math.round(s.right/s.graded*100):100;
    addXp(s.xp);
    if(s.cfg.stage && !hpOut){ const k=s.cfg.stage.u+':'+s.cfg.stage.key, old=S.stages[k]; S.stages[k]={acc:Math.max(acc,old?old.acc:0),at:Date.now()}; }
    if(s.cfg.stage && s.hadWrong && s.cfg.stage.gids) s.cfg.stage.gids.forEach(g=>{ S.grammar[g]=true; });
    if(s.cfg.real){
      if(!hpOut){ const old=S.done[s.cfg.id]; S.done[s.cfg.id]={acc:Math.max(acc,old?old.acc:0),at:Date.now()}; S.lastLesson=s.cfg.id; }
      if(s.hadWrong) s.entries.forEach(e=>{ if(e.item.t==='grammar') S.grammar[e.item.gid]=true; });
    }
    S.history.unshift({t:Date.now(),title:s.cfg.title,acc,xp:s.xp,right:s.right,total:s.graded,hpOut}); S.history=S.history.slice(0,30); save();
    const vlist=[...s.vids].map(id=>vById(id)).filter(Boolean);
    const glist=s.cfg.real&&s.hadWrong?s.entries.filter(e=>e.item.t==='grammar').map(e=>e.item):[];
    $('#lsFoot').style.display='none'; $('#lsBar').style.width='100%';
    $('#lsBody').innerHTML=`<div class="text-center pt-6">
      <div style="font-size:72px">${hpOut?'💔':(acc>=80?'🏆':'🎉')}</div>
      <h2 class="text-3xl font-black mt-2">${hpOut?t('hp_out'):t('lesson_done')}</h2>
      ${s.cfg.stage&&!hpOut&&s.cfg.stage.after?`<div class="card p-4 mt-6 font-bold">${tx(s.cfg.stage.after)}</div>`:''}
      <div class="grid grid-cols-2 gap-3 mt-6 text-left" ${s.graded===0?'style="display:none"':''}>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('correct_cnt')}</div><div class="text-2xl font-black text-green-600">${s.right}</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('total_q')}</div><div class="text-2xl font-black">${s.graded}</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('accuracy')}</div><div class="text-2xl font-black text-sky-500">${acc}%</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('xp_gain')}</div><div class="text-2xl font-black text-amber-500">+${s.xp}</div></div>
        <div class="card p-4 col-span-2"><div class="text-xs font-bold text-slate-400">${t('new_wrong')}</div><div class="text-2xl font-black text-red-500">${s.newWrong}</div></div>
      </div>
      ${(vlist.length||glist.length)?`<div class="card p-4 mt-4 text-left"><div class="font-black mb-2">📌 ${t('suggest')}</div>
        ${vlist.map(v=>`<span class="chip han" style="display:inline-block;margin:3px;font-size:14px">${v.han} <small>${v.py}</small></span>`).join('')}
        ${glist.map(g=>`<div class="text-sm mt-2">📘 ${tx(g.title)}</div>`).join('')}</div>`:''}
      <div class="grid gap-3 mt-6 pb-6">
        ${hpOut?`<button class="btn btn-blue" id="lsRetry">${t('retry')}</button>`:''}
        <button class="btn btn-primary" id="lsBack">${s.cfg.stage?t('back_unit'):t('back_map')}</button></div></div>`;
    $('#lsBack').onclick=()=>this.close();
    if(hpOut) $('#lsRetry').onclick=()=>{ const cfg=s.cfg; cfg.entries=s.entries; this.open(cfg); };
  },
  //   // exit：按左上角 ✕。還沒結束時先跳出「確定要離開嗎？」
  exit(){
    if(this.s&&this.s.ended){ this.close(); return; }
    Modal.confirm({title:t('exit_title'),body:t('exit_body'),ok:t('leave'),cancel:t('stay'),onOk:()=>this.close()});
  },
  //   // close：關閉練習畫面。若是 5 步驟流程的步驟，會回到「單元首頁」；否則回首頁
  close(){ SpeechPracticeModule.abort(); try{speechSynthesis.cancel();}catch(e){} $('#lessonLayer').classList.remove('open'); $('#nav').style.display='flex'; const cfg=this.s&&this.s.cfg; this.s=null; if(cfg&&cfg.onClose) cfg.onClose(); App.render(); if(cfg&&cfg.stage) App.openUnit(cfg.stage.u); }
};

/* ---- 題型渲染器 ---- */
// Q：每一種題型的「畫面 + 批改規則」。題目的 t 是什麼，就會用 Q[t] 來畫。
// 每個 Q.xxx = (box, it) => { ... } 拿到兩樣東西：
//   box：要把畫面放進去的空盒子      it：這一題的資料（STAGEBANK 裡寫的那一筆）
// 作答型題型最後必須設定：cur.ans = ()=>({correct:是否答對, user:學生答案, ans:正確答案文字})
//                          cur.lock = ()=>{...} 批改後鎖定畫面並標示對錯
// 教學型題型（vocab / flip / grammar）不需要 cur.ans，因為它們不計分。
const Q = {};

// Q.vocab：舊版「生詞卡」（單元二到五使用）。顯示漢字、拼音、意思、例句
Q.vocab = (box,it) => {
  const v=vById(it.v);
  box.innerHTML=`<div class="text-center pt-2">
    <span class="badge b-prog">${t('new_word')}</span>
    <div class="han mt-4" style="font-size:68px;font-weight:900;line-height:1.1">${v.han}</div>
    <div class="text-2xl text-sky-500 font-bold mt-2">${v.py}</div>
    <div class="mt-2"><span class="badge b-done">${v.pos}</span></div>
    <div class="text-xl font-bold mt-3">${v.en}</div>
    <!-- 【標準語音錄音放置區】${v.audio} -->
    <button class="btn btn-blue mt-4" id="vPlay">🔊 ${t('sp_listen')}</button>
    <div class="card p-4 mt-6 text-left"><div class="han text-lg font-bold">${v.ex}</div><div class="text-sm text-slate-500">${v.exPy}</div><div class="text-sm text-slate-400">${v.exEn}</div></div></div>`;
  $('#vPlay').onclick=()=>playStd(v.audio,v.han);
};

// Q.grammar：文法說明頁。標題 → 說明 → 句型公式(formula) → 小提醒(tip) → 例句（可播放）
Q.grammar = (box,it) => {
  box.innerHTML=`<span class="badge b-prog">📘 ${t('grammar')}</span>
    <h2 class="text-2xl font-black mt-3">${tx(it.title)}</h2>
    <p class="mt-2 text-slate-600 leading-relaxed">${tx(it.body)}</p>${it.formula?`<div class="fm han">${it.formula}</div>`:''}${it.tip?`<div class="tipbox">${tx(it.tip)}</div>`:''}
    <div class="text-sm font-black text-slate-400 mt-5">${t('example')}</div><div class="grid gap-3 mt-2">${it.ex.map((e,i)=>`<div class="card p-4 flex items-center gap-3"><button class="btn btn-blue btn-sm" data-i="${i}">🔊</button><div><div class="han text-lg font-bold">${e[0]}</div><div class="text-sm text-slate-500">${e[1]}</div><div class="text-sm text-slate-400">${e[2]}</div></div></div>`).join('')}</div>`;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>speakText(it.ex[+b.dataset.i][0]));
};

// Q.flip：★翻轉字卡。正面只有漢字（可聽發音），點一下翻到背面看拼音、意思、例句。
// 原理：CSS 的 .flip-in 轉 180 度（樣式在最上面 style 的 .flip）。學生翻過面才會啟用「繼續」。
Q.flip = (box,it) => {
  const v=vById(it.v), s=Lesson.s, n=s.entries.length;
  box.innerHTML=`<div class="text-center text-sm font-bold text-slate-400 mb-3">🃏 ${t('flip_title')} ${s.i+1} / ${n}</div>
  <div class="flip" id="fcard"><div class="flip-in">
    <div class="face front card">
      <div class="han" style="font-size:84px;font-weight:900;line-height:1.1">${v.han}</div>
      <button class="btn btn-blue mt-6" id="fP1">🔊 ${t('sp_listen')}</button>
      <div class="text-sm text-slate-400 mt-6">👆 ${t('flip_tip')}</div>
    </div>
    <div class="face back card">
      <div class="han" style="font-size:40px;font-weight:900">${v.han}</div>
      <div class="text-2xl text-sky-500 font-bold mt-1">${v.py}</div>
      <div class="mt-2"><span class="badge b-done">${v.pos}</span></div>
      <div class="text-xl font-bold mt-2">${v.en}</div>
      <div class="p-3 mt-4 text-left w-full rounded-xl" style="background:#fff;border:2px solid #eee">
        <div class="flex items-center gap-2"><button class="btn btn-blue btn-sm" id="fP2">🔊</button><div><div class="han font-bold">${v.ex}</div><div class="text-xs text-slate-500">${v.exPy}</div><div class="text-xs text-slate-400">${v.exEn}</div></div></div>
      </div>
      <div class="text-xs text-slate-400 mt-3">${t('flip_back')}</div>
    </div></div></div>`;
  const c=$('#fcard');
  c.onclick=()=>{ c.classList.toggle('on'); if(c.classList.contains('on')){ cur.flipped=true; Lesson.sync(); } };
  $('#fP1').onclick=e=>{ e.stopPropagation(); playStd(v.audio,v.han); };
  $('#fP2').onclick=e=>{ e.stopPropagation(); speakText(v.ex); };
};

// Q.mc：單選題。也同時給聽力題(listen)與閱讀題(read)使用（它們只是多一個播放鈕或短文）
Q.mc = (box,it,r) => {
  let head='';
  if(it.t==='listen') head=`<div class="text-center my-4"><div class="text-sm text-slate-500 mb-2">${t('listen_q')}</div><button class="btn btn-blue" id="lPlay" style="font-size:28px;padding:20px 34px">🔊</button></div>`;
  if(it.t==='read') head=`<div class="card p-4 mb-3"><div class="han text-xl leading-relaxed">${it.passage}</div><details class="mt-2"><summary>${t('pinyin')}</summary><div class="text-sm text-slate-500 mt-1">${it.pinyin}</div></details></div>`;
  box.innerHTML=`${head}<h2 class="qtitle">${tx(it.q)}</h2><div class="grid gap-3">${it.opts.map((o,i)=>`<button class="opt han" data-i="${i}">${o}</button>`).join('')}</div>`;
  if(it.t==='listen'){ $('#lPlay').onclick=()=>playStd(it.audio,it.say); }
  cur.sel=null;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ cur.sel=+b.dataset.i; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); Lesson.sync(); });
  cur.ans=()=>cur.sel==null?null:{correct:cur.sel===it.ans,user:it.opts[cur.sel],ans:it.opts[it.ans],sel:cur.sel};
  cur.lock=a=>box.querySelectorAll('.opt').forEach((b,i)=>{ b.classList.remove('sel'); if(i===it.ans) b.classList.add('ok'); else if(i===a.sel) b.classList.add('bad'); });
};
Q.listen = Q.mc; Q.read = Q.mc;

// Q.multi：多選題。必須「選到的」和「正確答案」完全一致才算對
Q.multi = (box,it) => {
  box.innerHTML=`<h2 class="qtitle">${tx(it.q)}</h2><div class="grid gap-3">${it.opts.map((o,i)=>`<button class="opt han" data-i="${i}">${o}</button>`).join('')}</div>`;
  cur.set=new Set();
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(cur.set.has(i)) cur.set.delete(i); else cur.set.add(i); b.classList.toggle('sel',cur.set.has(i)); Lesson.sync(); });
  const key=a=>[...a].sort().join(',');
  cur.ans=()=>cur.set.size?{correct:key(cur.set)===key(it.ans),user:[...cur.set].map(i=>it.opts[i]).join('、'),ans:it.ans.map(i=>it.opts[i]).join('、'),sel:[...cur.set]}:null;
  cur.lock=a=>box.querySelectorAll('.opt').forEach((b,i)=>{ b.classList.remove('sel'); const should=it.ans.includes(i), chose=(a.sel||[]).includes(i); if(should) b.classList.add('ok'); else if(chose) b.classList.add('bad'); });
};

// Q.match：配對題。左右兩欄打亂；先點左邊再點右邊。全部配完才能繼續；中途配錯過就不算全對
Q.match = (box,it,r) => {
  const Ls=shuffle(it.pairs.map((p,i)=>({i,x:p[0]}))), Rs=shuffle(it.pairs.map((p,i)=>({i,x:p[1]})));
  box.innerHTML=`<h2 class="qtitle">${tx(it.q)||t('match_q')}</h2><div class="text-sm text-slate-500 mb-3">${t('match_q')}</div>
    <div class="grid grid-cols-2 gap-3"><div class="grid gap-3" data-c="L">${Ls.map(o=>`<button class="opt han" data-i="${o.i}">${o.x}</button>`).join('')}</div>
    <div class="grid gap-3" data-c="R">${Rs.map(o=>`<button class="opt han" data-j="${o.i}">${o.x}</button>`).join('')}</div></div>`;
  cur.left=null; cur.done=new Set(); cur.miss=0;
  const lb=box.querySelectorAll('[data-i]'), rb=box.querySelectorAll('[data-j]');
  lb.forEach(b=>b.onclick=()=>{ if(b.disabled) return; cur.left=+b.dataset.i; lb.forEach(x=>x.classList.toggle('sel',x===b)); });
  rb.forEach(b=>b.onclick=()=>{
    if(b.disabled||cur.left==null) return; const j=+b.dataset.j, i=cur.left;
    if(i===j){ cur.done.add(i); b.classList.add('ok'); b.disabled=true; lb.forEach(x=>{ if(+x.dataset.i===i){ x.classList.remove('sel'); x.classList.add('ok'); x.disabled=true; } }); }
    else { cur.miss++; b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); lb.forEach(x=>x.classList.remove('sel')); }
    cur.left=null; Lesson.sync();
  });
  cur.ans=()=>cur.done.size===it.pairs.length?{correct:cur.miss===0,user:cur.miss+' ✗',ans:it.pairs.map(p=>p[0]+' ＝ '+p[1]).join('；')}:null;
  cur.lock=()=>{ box.querySelectorAll('.opt').forEach(b=>{ b.classList.remove('sel'); b.classList.add('ok'); }); };
};

// Q.fill：填空題。題目中的 ___ 會變成空格，點下方的詞放進去
Q.fill = (box,it) => {
  box.innerHTML=`<h2 class="qtitle">${t('fill_q')}</h2>
    <div class="card p-5 han text-2xl text-center mb-5" style="line-height:1.8">${it.q.replace('___','<span class="blank" id="blank">＿＿</span>')}</div>
    <div class="flex flex-wrap gap-3 justify-center">${it.opts.map((o,i)=>`<button class="chip han" data-i="${i}">${o}</button>`).join('')}</div>`;
  cur.sel=null;
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ cur.sel=it.opts[+b.dataset.i]; $('#blank').textContent=cur.sel; box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b)); Lesson.sync(); });
  cur.ans=()=>cur.sel==null?null:{correct:cur.sel===it.ans,user:cur.sel,ans:it.ans,sel:cur.sel};
  cur.lock=a=>{ const bl=$('#blank'); if(bl){ bl.textContent=a.sel||it.ans; bl.style.color=a.correct?'#46a302':'#ea2b2b'; bl.style.borderColor=a.correct?'#58cc02':'#ff4b4b'; } };
};

// Q.type：輸入題。學生打字回答，漢字或拼音都可以（會忽略聲調與空格）
Q.type = (box,it) => {
  box.innerHTML=`<h2 class="qtitle">${t('type_q')}</h2>
    <div class="card p-5 han text-2xl text-center mb-4" style="line-height:1.8">${it.q.replace('___','<span class="blank">＿＿</span>')}${it.hint?`<div class="text-sm text-slate-400 mt-1">💡 ${it.hint}</div>`:''}</div>
    <input id="tin" class="inp han" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t('type_ph')}">`;
  const inp=$('#tin'); inp.oninput=()=>Lesson.sync();
  inp.onkeydown=e=>{ if(e.key==='Enter'){ const m=$('#lsMain'); if(!m.disabled) m.click(); } };
  cur.ans=()=>{ const v=inp.value.trim(); if(!v) return null; const ok=it.ans.some(x=>plain(x)===plain(v)); return {correct:ok,user:v,ans:it.ans[0]+(it.ans[1]?'（'+it.ans[2]+'）':'')}; };
  cur.lock=a=>{ inp.disabled=true; inp.style.borderColor=a.correct?'#58cc02':'#ff4b4b'; };
};

// Q.order：排序題。點詞牌排出句子；再點一次可以退回。tokens 是正確的詞，extra 是干擾詞
Q.order = (box,it) => {
  const tokens=shuffle(it.tokens.concat(it.extra||[])), placed=[];
  box.innerHTML=`<h2 class="qtitle">${t('order_q')}</h2><div class="card p-4 mb-3 text-lg font-bold">${tx(it.en)}</div><div id="oAns" class="tray han"></div><div id="oBank" class="bank han"></div>`;
  const tok=k=>`<button class="tok" data-k="${k}">${tokens[k]}${it.py&&it.py[tokens[k]]?`<small>${it.py[tokens[k]]}</small>`:''}</button>`;
  function draw(){
    $('#oAns').innerHTML=placed.map(tok).join('');
    $('#oBank').innerHTML=tokens.map((w,k)=>placed.includes(k)?`<span class="tok ghost">${w}</span>`:tok(k)).join('');
    box.querySelectorAll('.tok[data-k]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, p=placed.indexOf(k); if(p>=0) placed.splice(p,1); else placed.push(k); draw(); Lesson.sync(); });
  }
  draw();
  cur.ans=()=>{ if(!placed.length) return null; const u=placed.map(k=>tokens[k]).join(''); return {correct:u===it.ans,user:u,ans:it.ans}; };
};

// Q.speak：發音題。使用口說模組(SpeechUI)錄音比對；也可以按「略過」不計分
Q.speak = (box,it,r) => {
  const sent=SPEECH.find(x=>x.id===it.sid);
  if(r){ box.classList.remove('locked'); box.innerHTML=`<div class="card p-5 text-center"><div class="han text-3xl font-black">${sent.han}</div><div class="text-slate-500 mt-1">${sent.py}</div><div class="text-sm text-slate-400">${sent.en}</div>${r.skipped?'<div class="text-xs text-amber-600 mt-2">'+t('skip')+'</div>':''}</div>`; return; }
  box.innerHTML=`<h2 class="qtitle">🎤 ${t('speech_title')}</h2><div id="spBox"></div><div class="text-center"><button class="link" id="skipSp">${t('skip')}</button></div>`;
  SpeechUI.mount($('#spBox'),sent,res=>{ cur.res=res; Lesson.sync(); });
  $('#skipSp').onclick=()=>Lesson.skip();
  cur.ans=()=>cur.res?{correct:cur.res.passed,user:cur.res.text,ans:sent.han}:null;
};

/* =====================================================================
   8. 頁面（Views）
   【功能】畫面長相。每個 View.xxx 是一個頁面，回傳一段 HTML 文字：
           View.home 首頁、View.vocab 詞彙庫、View.speech 口說、
           View.review 複習中心、View.profile 個人中心。
   【提醒】class="..." 裡的 text-xl、p-4 等是 Tailwind 的樣式縮寫，不用背，需要時再查。
   ===================================================================== */
const View = {};
const stars = n => '★'.repeat(n)+'☆'.repeat(5-n);

// View.home：首頁。由上到下：頂部資訊 → 每日目標 → 今日複習 → 繼續學習 → 口說入口 → 單元地圖（A1、A2）
View.home = () => {
  rollDaily();
  const lvl=curLevel(), nl=nextLesson(), pct=Math.min(100,Math.round(S.dailyXp/DAILY_GOAL*100)), rc=reviewCount();
  //   // planBlock：5 步驟單元在首頁卡片裡的樣子（五個圖示的進度 + 「進入單元」按鈕）
  const planBlock=(u,open)=>`<div class="flex items-center gap-1 justify-center">${STAGES[u.id].map(st=>`<span class="badge ${stageDone(u.id,st.key)?'b-done':'b-lock'}" style="font-size:14px">${st.icon}</span>`).join('<span class="text-slate-300">›</span>')}</div>
      <button class="btn btn-primary" onclick="${open?'App.openUnit('+u.id+')':'App.toast(\''+t('locked_msg')+'\')'}">${open?'📚 '+t('open_unit'):'🔒 '+t('st_lock')}</button>`;
  //   // unitCard：畫出「一張單元卡片」（封面、名稱、進度、按鈕）。UNITS 有幾筆就會呼叫幾次
  const unitCard=u=>{
    const st=unitStatus(u), open=st!=='lock', done=u.lessons.filter(lessonDone).length;
    const badge=st==='done'?`<span class="badge b-done">✓ ${t('st_done')}</span>`:st==='prog'?`<span class="badge b-prog">▶ ${t('st_prog')}</span>`:`<span class="badge b-lock">🔒 ${t('st_lock')}</span>`;
    return `<div class="card overflow-hidden" style="${open?'':'opacity:.8'}">
      <div class="flex">
        <!-- 【單元/課程插圖放置區】assets/images/unit${u.id}.png（找不到時顯示 emoji 底圖） -->
        <div class="unit-img" style="background:${u.grad}">${u.emoji}<img src="${ASSETS.images}unit${u.id}.png" alt="" onerror="this.remove()"></div>
        <div class="p-3 flex-1">
          <div class="flex items-center justify-between"><span class="text-xs font-black text-slate-400">${t('unit')} ${u.id} ・ ${u.level}</span>${badge}</div>
          <div class="font-black text-lg">${S.lang==='zh'?u.zh:u.en}</div>
          <div class="text-xs text-slate-500">${t('topic')}：${tx(u.topic)}</div>
          <div class="text-xs mt-1 text-slate-400">📚 ${u.plan?'🧭 '+stageDoneCount(u.id)+'/'+STAGES[u.id].length+' '+(S.lang==='zh'?'個學習步驟':'steps'):u.lessons.length+' '+t('lessons_n')+'（'+done+'/'+u.lessons.length+'）'} ・ ${open?'🔓 '+t('enter_yes'):'🔒 '+t('enter_no')}</div>
        </div></div>
      <div class="p-3 grid gap-2" style="border-top:2px solid #f0f0f0">
        ${u.plan?planBlock(u,open):''}${u.lessons.map((lid,k)=>{ const un=lessonUnlocked(u,lid), dn=lessonDone(lid), isCur=un&&!dn;
          return `<button class="lnode ${dn?'done':isCur?'cur':'lock'}" ${un?`onclick="App.startLesson('${lid}')"`:`onclick="App.toast('${t('locked_msg')}')"`}>
            <span class="dot">${dn?'✓':(un?'▶':'🔒')}</span><span class="flex-1">${lid} ${tx(LESSONS[lid].title)}</span>${dn?`<span class="text-xs text-green-600">${S.done[lid].acc}%</span>`:''}</button>`; }).join('')}
      </div></div>`;
  };
  const byLevel=lv=>UNITS.filter(u=>u.level===lv).map(unitCard).join('<div class="connector"></div>');
  return `
  <header class="hdr p-5 pb-7 text-white" style="border-radius:0 0 32px 32px">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- 【Logo 放置區】請把 logo 放到 assets/logo.png -->
        <img src="${ASSETS.logo}" alt="huaban" class="rounded-xl bg-white" style="width:44px;height:44px;padding:4px" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="logo-fb">伴</div>
        <div><div class="font-black text-xl">huaban 華伴</div><div class="text-sm" style="opacity:.9">${t('welcome')}</div></div>
      </div>
      <div class="pill">${t('level')} ${lvl}</div>
    </div>
    <div class="flex gap-3 mt-4">
      <div class="stat">⭐ ${S.xp}<small>XP</small></div>
      <div class="stat">🔥 ${streakNow()}<small>${t('streak')}</small></div>
      <div class="stat">🎯 ${lvl}<small>${t('level')}</small></div>
    </div>
  </header>
  <div class="p-4 grid gap-3" style="margin-top:-16px">
    <div class="card p-4"><div class="flex justify-between font-black"><span>🎯 ${t('daily')}</span><span class="text-sm text-slate-500">${Math.min(S.dailyXp,DAILY_GOAL)}/${DAILY_GOAL} XP</span></div>
      <div class="bar mt-2"><div class="barfill gold" style="width:${pct}%"></div></div></div>
    <div class="card p-4 flex items-center justify-between"><div><div class="font-black">🔁 ${t('today_review')}</div><div class="text-sm text-slate-500">${rc} ${t('items')}</div></div>
      <button class="btn btn-blue btn-sm" onclick="App.go('review')">${t('go_review')}</button></div>
    <div class="card p-4"><div class="text-xs font-black text-slate-400">${t('recent')}</div>
      ${nl?`<div class="flex items-center justify-between mt-1"><div><div class="font-black">${t('unit')} ${nl.u.id} ・ ${tx(nlTitle(nl))}</div><div class="text-xs text-slate-500">${nl.stage?'':nl.lid}</div></div><button class="btn btn-primary btn-sm" onclick="${nl.stage?'App.openUnit('+nl.u.id+')':'App.startLesson(\''+nl.lid+'\')'}">${S.lastLesson?t('continue'):t('start')}</button></div>`:`<div class="font-black mt-1">${t('all_done')}</div>`}</div>
    <button class="card p-4 flex items-center gap-3 text-left" style="background:linear-gradient(135deg,#e8f7ff,#fff)" onclick="App.go('speech')"><span style="font-size:34px">🎤</span><div><div class="font-black">${t('speech_entry')}</div><div class="text-xs text-slate-500">${t('speech_sub')}</div></div></button>
    <h2 class="font-black text-xl mt-2">🗺️ ${t('path')} ・ A1</h2>${byLevel('A1')}
    <div class="connector"></div>
    <h2 class="font-black text-xl mt-2">🗺️ ${t('path')} ・ A2</h2>${byLevel('A2')}
  </div>`;
};

// View.vocab：詞彙庫頁面。可依級別、單元篩選，也能搜尋漢字／拼音／英文
View.vocab = () => {
  const f=App.vf, us=UNITS.filter(u=>f.lv==='all'||u.level===f.lv);
  return `<div class="p-4"><h1 class="text-2xl font-black mb-3">📖 ${t('vocab_title')}</h1>
    <div class="flex gap-2 mb-3">${['all','A1','A2'].map(l=>`<button class="chip ${f.lv===l?'on':''}" style="padding:6px 14px;font-size:14px" onclick="App.vf.lv='${l}';App.vf.u='all';App.render()">${l==='all'?t('all'):l}</button>`).join('')}</div>
    <select class="mb-3" onchange="App.vf.u=this.value;App.drawVocab()"><option value="all">${t('all_units')}</option>${us.map(u=>`<option value="${u.id}" ${String(f.u)===String(u.id)?'selected':''}>${t('unit')} ${u.id} ・ ${S.lang==='zh'?u.zh:u.en}</option>`).join('')}</select>

};

// View.speech：口說練習教室。上方是句子編號，中間是錄音區，下方是上一句／下一句
View.speech = () => {
  const sent=SPEECH[App.spIdx];
  return `<div class="p-4"><h1 class="text-2xl font-black mb-1">🎤 ${t('speech_title')}</h1>
    <div class="flex gap-2 overflow-x-auto pb-3 mb-2">${SPEECH.map((s,i)=>{ const st=SpeechPracticeModule.stats(s.id); return `<button class="chip ${i===App.spIdx?'on':''}" style="padding:6px 12px;font-size:14px;white-space:nowrap" onclick="App.spIdx=${i};App.render()">${i+1}${st.passes>0?' ✓':''}</button>`; }).join('')}</div>
    <div id="spMount"></div>
    <div class="flex gap-3 mt-3"><button class="btn btn-ghost flex-1" ${App.spIdx===0?'disabled':''} onclick="App.spIdx--;App.render()">← ${t('sp_prevS')}</button><button class="btn btn-primary flex-1" ${App.spIdx===SPEECH.length-1?'disabled':''} onclick="App.spIdx++;App.render()">${t('sp_nextS')} →</button></div></div>`;

// View.review：複習中心。顯示錯題、不熟的單字、需重練的文法、尚未完成的口說，以及答題統計
View.review = () => {
  const wl=wrongList(), vl=dueVocab(), gl=grammarList(), sl=speechTodo();
  const sec=(title,count,btn,body)=>`<div class="card p-4"><div class="flex items-center justify-between mb-2"><div class="font-black">${title} <span class="badge b-prog">${count}</span></div>${btn||''}</div>${body}</div>`;
  const empty=`<div class="text-sm text-slate-400 py-2">${t('empty')}</div>`;
  const seen=VOCAB.filter(v=>getV(v.id).seen), dist=[0,1,2,3,4,5].map(n=>seen.filter(v=>getV(v.id).fam===n).length);
  const mx=Math.max(1,...dist);
  return `<div class="p-4 grid gap-3"><h1 class="text-2xl font-black">🔁 ${t('review_title')}</h1>
  ${sec('❌ '+t('sec_wrong'),wl.length,wl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewWrong()">${t('restart')}</button>`:'',
    wl.length?wl.map(w=>`<div class="py-2" style="border-top:1px solid #eee"><div class="han font-bold">${w.q}</div><div class="text-xs text-slate-500">${t('right_ans')}<span class="han">${w.ans}</span> ・ ${w.count} ${t('times')}</div><button class="btn btn-ghost btn-sm mt-1" onclick="App.resolveWrong('${w.key}')">✓ ${t('mark_known')}</button></div>`).join(''):empty)}
  ${sec('📒 '+t('sec_vocab'),vl.length,vl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewVocab()">${t('restart')}</button>`:'',
    vl.length?vl.map(v=>{ const s=getV(v.id); return `<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1"><span class="han font-black text-lg">${v.han}</span> <span class="text-sky-500 text-sm">${v.py}</span><div class="text-xs text-slate-500">${v.en} ・ <span class="text-amber-500">${stars(s.fam)}</span> ${s.review?'🔖':''}</div></div><button class="btn btn-ghost btn-sm" onclick="App.knowVocab('${v.id}')">✓</button></div>`; }).join(''):empty)}
  ${sec('📘 '+t('sec_grammar'),gl.length,gl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewGrammar()">${t('restart')}</button>`:'',
    gl.length?gl.map(g=>`<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1 font-bold">${tx(GRAMMAR[g].title)}</div><button class="btn btn-ghost btn-sm" onclick="App.knowGrammar('${g}')">✓ ${t('mark_known')}</button></div>`).join(''):empty)}
  ${sec('🎤 '+t('sec_speech'),sl.length,'',
    sl.length?sl.map(s=>`<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1"><div class="han font-bold">${s.han}</div><div class="text-xs text-slate-500">${s.py}</div></div><button class="btn btn-blue btn-sm" onclick="App.spIdx=${SPEECH.indexOf(s)};App.go('speech')">${t('start')}</button></div>`).join(''):empty)}
  <div class="card p-4"><div class="font-black mb-2">📊 ${t('sec_hist')}</div>
    <div class="text-sm text-slate-500">${t('quiz_total')}：${S.quiz.t}（✓ ${S.quiz.c} / ✗ ${S.quiz.t-S.quiz.c}）</div>
    <div class="text-xs font-bold text-slate-400 mt-3 mb-1">${t('fam_dist')}</div>
    <div class="flex items-end gap-2" style="height:70px">${dist.map((n,i)=>`<div class="flex-1 text-center text-xs"><div style="height:${Math.max(4,n/mx*48)}px;background:var(--g);border-radius:6px 6px 0 0"></div>${i}★<br><b>${n}</b></div>`).join('')}</div>
    ${S.history.slice(0,5).map(h=>`<div class="text-xs text-slate-500 py-1" style="border-top:1px solid #eee"><span class="han">${tx(h.title)}</span> ・ ${h.acc}% ・ +${h.xp}XP ・ ${dstr(h.t)}</div>`).join('')}</div>
  </div>`;
};

// View.profile：個人中心。顯示各種統計、切換語言、清除紀錄

    <div class="grid grid-cols-2 gap-3">

      ${cell(t('s_streak'),'🔥 '+streakNow()+' '+t('days'))}${cell(t('s_vocab'),seen+'/'+VOCAB.length)}${cell(t('s_acc'),acc)}${cell(t('s_speech'),sp)}</div>
    <div class="card p-4"><div class="font-black mb-2">🌐 ${t('lang')}</div><div class="flex gap-3"><button class="btn flex-1 ${S.lang==='zh'?'btn-primary':'btn-ghost'}" onclick="App.setLang('zh')">繁體中文</button><button class="btn flex-1 ${S.lang==='en'?'btn-primary':'btn-ghost'}" onclick="App.setLang('en')">English</button></div></div>
    <div class="card p-4"><div class="font-black mb-2">🕒 ${t('recent_hist')}</div>
      ${S.history.length?S.history.slice(0,8).map(h=>`<div class="py-2 text-sm flex justify-between" style="border-top:1px solid #eee"><span class="han">${h.hpOut?'💔 ':'✅ '}${tx(h.title)}</span><span class="text-slate-500">${h.acc}% ・ +${h.xp}XP</span></div>`).join(''):`<div class="text-sm text-slate-400">${t('no_hist')}</div>`}</div>
    <button class="btn btn-red" onclick="App.clearData()">🗑️ ${t('clear_data')}</button></div>`;

/* =====================================================================
   9. App 控制器
   【功能】APP 的「總指揮」：切換頁面、打開單元首頁、開始某個步驟、複習、切換語言、清除資料。
   【最後幾行】把按鈕接上功能，並第一次顯示首頁（App.render()）。
   ===================================================================== */
// App：總指揮。App.view 是目前在哪一頁；App.render() 會依 App.view 重畫畫面
const App = {
  view:'home', spIdx:0, vf:{lv:'all',u:'all',q:''},
  //   // go：切換頁面。App.go('vocab') 就會到詞彙庫
  go(v){ SpeechPracticeModule.abort(); this.view=v; this.render(); window.scrollTo(0,0); },
  //   // render：重畫目前頁面與下方導覽列。資料有變動時呼叫它，畫面就會更新
  render(){
    SpeechPracticeModule.abort();
    $('#view').innerHTML=View[this.view]();
    if(this.view==='vocab') this.drawVocab();
    if(this.view==='speech') SpeechUI.mount($('#spMount'),SPEECH[this.spIdx],res=>{ if(res&&res.passed){ addXp(3); } this.refreshSpeechChips(); });
    this.renderNav();
  },
  refreshSpeechChips(){ /* 練習完成後更新章節 ✓ 標記，不重繪錄音區 */
    const chips=document.querySelectorAll('#view .overflow-x-auto .chip');
    chips.forEach((c,i)=>{ const st=SpeechPracticeModule.stats(SPEECH[i].id); c.textContent=(i+1)+(st.passes>0?' ✓':''); });
  },
  //   // renderNav：畫下方五個導覽按鈕（學習、詞彙、口說、複習、我的）。想新增分頁就改這裡 + View
  renderNav(){
    const tabs=[['home','🏠','nav_home'],['vocab','📖','nav_vocab'],['speech','🎤','nav_speech'],['review','🔁','nav_review'],['profile','🧑','nav_me']];
    $('#nav').innerHTML=tabs.map(([id,ic,k])=>`<button class="navbtn ${this.view===id?'on':''}" onclick="App.go('${id}')"><span>${ic}</span>${t(k)}${id==='review'&&reviewCount()?` <b style="color:var(--r)">•</b>`:''}</button>`).join('');
  },
  //   // drawVocab：依篩選條件重畫「詞彙庫」的單字清單
  drawVocab(){
    const f=this.vf, q=f.q.trim(), pq=plain(q);
    const list=VOCAB.filter(v=>(f.lv==='all'||v.lv===f.lv)&&(f.u==='all'||String(v.u)===String(f.u))&&(!q||v.han.includes(q)||plain(v.py).includes(pq)||v.en.toLowerCase().includes(q.toLowerCase())||v.ex.includes(q)));
    $('#vList').innerHTML=list.length?list.map(v=>{ const s=getV(v.id), pct=s.fam*20;
      return `<div class="card p-4">
        <div class="flex items-start justify-between"><div><span class="han" style="font-size:34px;font-weight:900">${v.han}</span> <span class="badge b-done">${v.pos}</span><div class="text-sky-500 font-bold">${v.py}</div></div>
          <!-- 【標準語音錄音放置區】${v.audio} -->
          <button class="btn btn-blue btn-sm" onclick="App.playVocab('${v.id}')">🔊</button></div>
        <div class="font-bold mt-1">${v.en}</div>
        <div class="mt-2 p-2 rounded-xl" style="background:#f7f9f4"><div class="han">${v.ex}</div><div class="text-xs text-slate-500">${v.exPy}</div><div class="text-xs text-slate-400">${v.exEn}</div></div>
        <div class="flex items-center gap-3 mt-3"><div class="flex-1"><div class="text-xs text-slate-400">${t('fam')} <span class="text-amber-500">${stars(s.fam)}</span> ${pct}%</div><div class="bar" style="height:8px"><div class="barfill gold" style="width:${pct}%"></div></div></div>
          <button class="btn ${s.review?'btn-ghost':'btn-primary'} btn-sm" onclick="App.toggleReview('${v.id}')">${s.review?t('in_review'):'＋ '+t('add_review')}</button></div></div>`; }).join(''):`<div class="text-center text-slate-400 py-8">${t('no_result')}</div>`;
  },
  playVocab(id){ const v=vById(id); playStd(v.audio,v.han); },
  toggleReview(id){ const s=ensureV(id); s.review=!s.review; if(s.review) s.due=Math.min(s.due||Date.now(),Date.now()); save(); this.drawVocab(); this.renderNav(); },
  startLesson(lid){ Lesson.startLesson(lid); },
  /* ---- 單元首頁：依序解鎖的學習步驟 ---- */
  //   // openUnit：★打開「單元首頁」，把這個單元的 5 個步驟依序列出。
  //   //   已完成 ✓ 綠色；目前可做 ▶ 藍色；尚未解鎖 🔒 灰色（點了會提示「請先完成上一步」）
  //   //   步驟名稱與順序來自 STAGES；題目數量來自 STAGEBANK
  openUnit(id){
    const u=unitById(id); if(!unitUnlocked(u)) return this.toast(t('locked_msg'));
    const st=STAGES[id], dn=stageDoneCount(id), all=dn===st.length; let lastG=null;
    const rows=st.map((s,i)=>{
      const un=stageUnlocked(id,i), d=stageDone(id,s.key), isCur=un&&!d, rec=S.stages[id+':'+s.key], n=STAGEBANK[s.id].items.length;
      const head=tx(s.group)!==lastG?`<div class="text-sm font-black text-slate-500 mt-4 mb-1">${tx(s.group)}</div>`:''; lastG=tx(s.group);
      const badge=d?`<span class="badge b-done">✓ ${rec.acc}%</span>`:isCur?`<span class="badge b-prog">▶ ${t('step_start')}</span>`:`<span class="badge b-lock">🔒</span>`;
      return head+`<button class="lnode stg ${d?'done':isCur?'cur':'lock'}" onclick="${un?`App.startStage(${id},'${s.key}')`:`App.toast('${t('stage_lock')}')`}">
        <span class="dot">${d?'✓':un?s.icon:'🔒'}</span>
        <span class="flex-1"><span class="block font-black">${tx(s.title)}</span><span class="block text-xs text-slate-500 font-semibold">${tx(s.desc)} ・ ${n?n+(S.lang==='zh'?' 題':' Q'):(S.lang==='zh'?'尚無題目':'No questions yet')}</span></span>${badge}</button>`;
    }).join('<div class="connector" style="height:10px"></div>');
    $('#unitLayer').innerHTML=`<div class="hdr text-white p-4" style="border-radius:0 0 28px 28px">
        <div class="flex items-center gap-3"><button class="btn btn-ghost btn-sm" onclick="App.closeUnit()">✕</button>
        <div class="flex-1"><div class="text-xs font-bold" style="opacity:.9">${t('unit')} ${u.id} ・ ${u.level}</div><div class="font-black text-xl">${u.emoji} ${S.lang==='zh'?u.zh:u.en}</div></div></div>
        <div class="bar mt-3" style="background:rgba(255,255,255,.3)"><div class="barfill gold" style="width:${dn/st.length*100}%"></div></div>
        <div class="text-xs font-bold mt-1" style="opacity:.95">${dn}/${st.length} ・ ${t('hub_hint')}</div></div>
      <div class="flex-1 overflow-y-auto px-4 pb-8">${all?`<div class="card p-4 mt-4 text-center font-black" style="background:#d7ffb8;border-color:#b5ec86">${t('hub_done')}</div>`:''}${rows}</div>`;
    $('#unitLayer').classList.add('open'); $('#nav').style.display='none';
  },
  //   // closeUnit：關閉單元首頁，回到首頁
  closeUnit(){ $('#unitLayer').classList.remove('open'); $('#nav').style.display='flex'; this.render(); },
  //   // startStage：★開始某個步驟。從 STAGEBANK 取出題目，包成 entries 交給 Lesson.open。
  //   //   uid 是單元編號，key 是步驟代號（vl / vp / gl / gp / rd）
  startStage(uid,key){
    const list=STAGES[uid], s=list.find(x=>x.key===key), i=list.indexOf(s);
    if(!stageUnlocked(uid,i)) return this.toast(t('stage_lock'));
    const entries=STAGEBANK[s.id].items.map((item,k)=>({item,ref:[s.id,k],key:s.id+':'+k}));
    if(!entries.length) return this.toast(S.lang==='zh'?'這一步還沒有題目':'No questions in this step yet');
    // 文法練習(gp)：自動把「文法學習(gl)」裡所有文法點，當作這一步要練習的文法
    const gl=STAGEBANK['u'+uid+'-gl'], gids=(key==='gp'&&gl)?gl.items.filter(x=>x.t==='grammar').map(x=>x.gid):s.gids;
    Lesson.open({id:s.id,title:s.title,real:false,stage:{u:uid,key,gids,after:s.after},entries});
  },
  toast(msg){ const d=document.createElement('div'); d.textContent=msg; d.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:70;font-size:14px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); },
  /* 複習中心動作 */
  //   // 以下三個 review 開頭的函式：從複習中心「重新開始練習」，把錯題／單字／文法再出一次
  reviewWrong(){
    const entries=wrongList().map(w=>{ const l=LESSONS[w.lid]||STAGEBANK[w.lid]; const item=l&&l.items[w.idx]; return item?{item,ref:[w.lid,w.idx],key:w.key}:null; }).filter(Boolean);
    if(!entries.length) return this.toast(t('nothing'));
    Lesson.open({id:'review',title:L('錯題複習','Mistake review'),real:false,entries});
  },
  reviewVocab(){
    const list=shuffle(dueVocab()).slice(0,10); if(!list.length) return this.toast(t('nothing'));
    const entries=list.map(v=>{ const others=shuffle(VOCAB.filter(x=>x.id!==v.id&&x.en!==v.en)).slice(0,3).map(x=>x.en); const opts=shuffle([v.en,...others]);
      return {key:'vq:'+v.id,item:{t:'mc',q:L(`「${v.han}」（${v.py}）是什麼意思？`,`What does 「${v.han}」 (${v.py}) mean?`),opts,ans:opts.indexOf(v.en),exp:L(`${v.han} = ${v.en}`,`${v.han} = ${v.en}`),v:v.id}}; });
    Lesson.open({id:'review',title:L('詞彙複習','Vocabulary review'),real:false,entries});
  },
  reviewGrammar(){
    const entries=grammarList().map(g=>({key:'g:'+g,item:GRAMMAR[g]})); if(!entries.length) return this.toast(t('nothing'));
    Lesson.open({id:'review',title:L('語法複習','Grammar review'),real:false,entries});
  },
  resolveWrong(k){ if(S.wrong[k]){ S.wrong[k].resolved=true; save(); this.render(); } },
  knowVocab(id){ const s=ensureV(id); s.review=false; s.seen=true; s.fam=5; s.due=Date.now()+FAM_DAYS[5]*864e5; save(); this.render(); },
  knowGrammar(g){ S.grammar[g]=false; save(); this.render(); },
  //   // setLang：切換介面語言（zh / en）
  setLang(l){ S.lang=l; save(); document.documentElement.lang=l==='zh'?'zh-Hant':'en'; this.render(); },
  //   // clearData：清除所有學習紀錄（會先跳出確認視窗）
  clearData(){
    Modal.confirm({title:t('confirm_title'),body:t('confirm_body'),ok:t('confirm_ok'),cancel:t('cancel'),onOk:()=>{
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      const lang=S.lang; S=defaults(); S.lang=lang; save(); this.view='home'; this.render(); this.toast('✓');
    }});
  }
};

/* =====================================================================
   10. 開發者模式（DevMode）：在網頁上新增／修改單元、生詞、題目，不用改程式碼
   ---------------------------------------------------------------------
   【怎麼進入】
     ‧ 畫面右下角的 🛠 按鈕，或網址後面加上 #dev
     ‧ 發布給學生前，把檔案最上面的 DEV_ENABLED 改成 false，🛠 就會消失、學生無法進入
   【怎麼結束】按右上角綠色的「▶ 結束並測試」，就會回到正常的 APP 畫面，用學生的角度測試。
   【資料存在哪】
     ‧ 你每改一個字都會「自動儲存」在這台電腦的瀏覽器裡（localStorage）。
     ‧ 要把成果交給別人 / 放進正式檔案，請用上方按鈕：
         💾 匯出內容    → 下載一個 .json 檔（可傳給組員，再用「📂 匯入內容」載入）
         ⬇ 下載更新後的 index.html → 把你編輯的內容直接寫進一份新的 index.html（最推薦）
   【這一章的結構（由上到下）】
     工具函式 → 題型名稱表 → DevMode 物件：
       畫面：vUnits（單元清單）、vUnit（單元編輯）、vStage（步驟的題目清單）、
             vItem（單一題目的表單）、vVocab（生詞庫）、vSpeech（口說句子）
       動作：act（按鈕被按時做什麼）、bind（輸入框打字時把資料存起來）
       題目：blank（空白新題）、toForm（讀進表單）、fromForm（檢查並存回）
       其他：preview（預覽）、doExport / doImport / downloadHtml（匯出入）
   ===================================================================== */

// ── 小工具 ──
// esc：把文字變安全，才能放進 HTML 的屬性裡（避免引號、< > 把畫面弄壞）
const esc = x => String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// getBy / setBy：用「路徑文字」讀寫資料，例如 getBy(題目,'opts.2') 等於 題目.opts[2]
const getBy = (o,p) => String(p).split('.').reduce((a,k)=>a==null?a:a[k],o);
function setBy(o,p,v){
  const ks=String(p).split('.'), last=ks.pop(); let a=o;
  ks.forEach((k,i)=>{ const nx=i+1<ks.length?ks[i+1]:last; if(a[k]==null||typeof a[k]!=='object') a[k]=/^\d+$/.test(nx)?[]:{}; a=a[k]; });
  a[last]=v;
}

const STAGE_TYPES = {vl:['flip'],vp:['mc','fill','match','listen','type','order','multi','speak'],gl:['grammar'],gp:['mc','fill','match','type','order','multi','speak'],rd:['read']};
